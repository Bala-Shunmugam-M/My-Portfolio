App.addRegColumn = function(){
  const r = this.current().regression;
  r.columns.push({ name: 'X'+r.columns.length, values: [] });
  this.saveAll();
  this.renderRegTab();
};
App.removeRegColumn = function(i){
  const r = this.current().regression;
  if(r.columns.length <= 2){ this.toast('Need at least 2 columns'); return; }
  r.columns.splice(i,1);
  if(r.responseIndex >= r.columns.length) r.responseIndex = r.columns.length-1;
  if(r.responseIndex === i) r.responseIndex = r.columns.length-1;
  else if(r.responseIndex > i) r.responseIndex--;
  this.saveAll();
  this.renderRegTab();
};
App.setRegResponse = function(i){
  this.current().regression.responseIndex = i;
  this.saveAll();
  this.renderRegTab();
};
App.updateRegCell = function(col, row, val){
  const r = this.current().regression;
  const v = val === '' ? null : parseFloat(val);
  while(r.columns[col].values.length <= row) r.columns[col].values.push(null);
  r.columns[col].values[row] = (v == null || isNaN(v)) ? null : v;
  this.saveAll();
};
App.addRegRow = function(){
  // Just trigger a re-render with one more visible row
  const r = this.current().regression;
  r.columns.forEach(c => c.values.push(null));
  this.saveAll();
  this.renderRegTab();
};
App.clearRegData = function(){
  if(!confirm('Clear all regression data?')) return;
  this.current().regression.columns.forEach(c => c.values = []);
  this.saveAll();
  this.renderRegTab();
};
App.regPasteTable = function(){
  const ta = document.getElementById('reg-paste');
  const text = ta.value.trim();
  if(!text){ this.toast('Nothing to paste'); return; }
  const lines = text.replace(/\r/g,'').split('\n').filter(l => l.trim());
  if(lines.length < 2){ this.toast('Need a header row + data rows'); return; }
  const sep = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ',');
  const header = lines[0].split(sep).map(s => s.trim());
  const rows = lines.slice(1).map(l => l.split(sep).map(s => s.trim()));
  const ncols = header.length;
  const cols = header.map((name, ci) => ({
    name: name || ('Col '+(ci+1)),
    values: rows.map(r => {
      const cell = r[ci];
      if(cell == null || cell === '') return null;
      const cleaned = String(cell).replace(/%$/,'').replace(/,/g,'');
      const n = parseFloat(cleaned);
      return isNaN(n) ? null : n;
    })
  }));
  this.current().regression.columns = cols;
  this.current().regression.responseIndex = ncols - 1;  // last column as Y by default
  this.saveAll();
  this.toast(`Loaded ${rows.length} rows, ${ncols} columns`);
  this.renderRegTab();
};

/* ----- REG: ALIGNED DATA (paired non-null values) ----- */
App.regAligned = function(){
  const r = this.current().regression;
  const cols = r.columns;
  const n = Math.max(...cols.map(c => c.values.length), 0);
  const aligned = cols.map(() => []);
  for(let i=0; i<n; i++){
    if(cols.every(c => c.values[i] != null && !isNaN(c.values[i]))){
      cols.forEach((c, j) => aligned[j].push(c.values[i]));
    }
  }
  return { columns: cols.map((c,i) => ({ name: c.name, values: aligned[i] })), n: aligned[0]?.length || 0 };
};

/* ----- REG: CORRELATION MATRIX ----- */
App.renderCorrMatrix = function(){
  const a = this.regAligned();
  if(a.n < 3){
    return `<div class="callout callout-info"><div class="callout-title">Need more data</div><div class="callout-body">Correlation needs at least 3 complete rows (no missing cells). Currently ${a.n}.</div></div>`;
  }
  const colMap = {};
  a.columns.forEach(c => colMap[c.name] = c.values);
  const matrix = SS.correlationMatrix(colMap);
  const names = a.columns.map(c => c.name);
  const r = this.current().regression;
  const yName = a.columns[r.responseIndex]?.name;

  // Identify strongest correlations with Y
  const corrWithY = names
    .filter(n => n !== yName)
    .map(n => ({ name: n, r: matrix[n]?.[yName]?.r, p: matrix[n]?.[yName]?.pValue }))
    .filter(c => c.r != null)
    .sort((a,b) => Math.abs(b.r) - Math.abs(a.r));

  const heatColor = r => {
    if(r == null) return 'var(--surface-2)';
    const abs = Math.abs(r);
    const hue = r > 0 ? 145 : 0;  // green for positive, red for negative
    const sat = 60 + abs * 30;
    const light = 90 - abs * 35;
    return `hsl(${hue},${sat}%,${light}%)`;
  };

  return `
    <div class="card">
      <div class="card-title">Pearson correlation matrix (n=${a.n})</div>
      <div class="text-sm tx-3 mb-3">Each cell is the Pearson r between two variables, colored by strength. p-value shown below each correlation. <strong>|r| ≥ 0.7</strong> is strong, <strong>0.4–0.7</strong> moderate, <strong>&lt; 0.4</strong> weak.</div>
      <div class="tbl-wrap">
        <table class="tbl" style="font-size:12px">
          <thead><tr><th></th>${names.map(n => `<th>${this.esc(n)}</th>`).join('')}</tr></thead>
          <tbody>
          ${names.map(rowName => `
            <tr>
              <td style="font-weight:600;background:var(--surface-2)">${this.esc(rowName)}</td>
              ${names.map(colName => {
                const cell = matrix[rowName]?.[colName];
                if(!cell || cell.r == null) return '<td style="text-align:center">—</td>';
                const sig = cell.pValue < 0.05;
                return `<td style="text-align:center;background:${heatColor(cell.r)};padding:8px">
                  <div class="text-mono" style="font-weight:600;font-size:13px">${cell.r.toFixed(3)}</div>
                  ${rowName!==colName?`<div class="text-xs ${sig?'':'tx-3'}" style="font-family:var(--f-mono);font-size:10px">p=${cell.pValue.toExponential(1)}${sig?' *':''}</div>`:''}
                </td>`;
              }).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>

      ${corrWithY.length > 0 ? `
        <div class="h3 mt-4">Predictor ranking by |r| with response <em>${this.esc(yName)}</em></div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>Rank</th><th>Predictor</th><th>r</th><th>|r|</th><th>p-value</th><th>Strength</th></tr></thead>
            <tbody>
            ${corrWithY.map((c,i) => {
              const abs = Math.abs(c.r);
              const strength = abs>=0.7?['strong','badge-good']:abs>=0.4?['moderate','badge-warn']:['weak','badge-info'];
              return `<tr>
                <td class="text-mono">${i+1}</td>
                <td>${this.esc(c.name)}</td>
                <td class="text-mono">${c.r.toFixed(3)}</td>
                <td class="text-mono">${abs.toFixed(3)}</td>
                <td class="text-mono">${c.p < 0.001 ? c.p.toExponential(1) : c.p.toFixed(3)}</td>
                <td><span class="badge ${strength[1]}">${strength[0]}</span></td>
              </tr>`;
            }).join('')}
            </tbody>
          </table>
        </div>
      ` : ''}
    </div>
  `;
};
App.drawCorrMatrix = function(){ /* matrix is HTML, no chart needed */ };

/* ----- REG: SIMPLE LINEAR REGRESSION ----- */
App.renderSimpleReg = function(){
  const a = this.regAligned();
  if(a.n < 3){
    return `<div class="callout callout-info"><div class="callout-title">Need more data</div><div class="callout-body">Simple regression needs at least 3 complete rows. Currently ${a.n}.</div></div>`;
  }
  if(this.state.regSimpleX == null){
    this.state.regSimpleX = 0;
    if(this.state.regSimpleX === this.current().regression.responseIndex) this.state.regSimpleX = 1 % a.columns.length;
  }
  const xIdx = this.state.regSimpleX;
  const yIdx = this.current().regression.responseIndex;
  if(xIdx === yIdx){
    return `<div class="callout callout-warn"><div class="callout-body">Pick a predictor different from the response (Y). Use the dropdown below.</div></div>`;
  }
  const x = a.columns[xIdx].values;
  const y = a.columns[yIdx].values;
  const lr = SS.linReg(x, y);
  if(!lr || lr.err){
    return `<div class="callout callout-bad"><div class="callout-body">${lr?.err || 'Regression failed'}</div></div>`;
  }
  return `
    <div class="card">
      <div class="card-title">Simple Linear Regression</div>
      <div class="grid-2 mb-3">
        <div>
          <label class="label">Predictor (X)</label>
          <select class="select" onchange="App.state.regSimpleX=+this.value;App.renderRegTab()">
            ${a.columns.map((c,i) => i===yIdx?'':`<option value="${i}" ${i===xIdx?'selected':''}>${this.esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="label">Response (Y)</label>
          <input class="input" value="${this.esc(a.columns[yIdx].name)}" disabled>
          <div class="help">Change in the Data tab (radio button).</div>
        </div>
      </div>

      <div class="callout callout-info mb-3">
        <div class="callout-title">Fitted equation</div>
        <div class="callout-body text-mono" style="font-size:16px;color:var(--accent);font-weight:600">
          ${this.esc(a.columns[yIdx].name)} = ${lr.intercept.toFixed(4)} + ${lr.slope.toFixed(4)} \u00d7 ${this.esc(a.columns[xIdx].name)}
        </div>
      </div>

      <div class="grid-4 mb-4">
        <div class="metric"><div class="metric-name">R\u00b2</div><div class="metric-val ${lr.r2>0.7?'c-green':lr.r2>0.4?'c-amber':'c-red'}">${lr.r2.toFixed(4)}</div><div class="metric-sub">${this.fmtPct(lr.r2*100,1)} variance explained</div></div>
        <div class="metric"><div class="metric-name">Slope</div><div class="metric-val">${lr.slope.toFixed(4)}</div><div class="metric-sub">SE = ${lr.seSlope.toFixed(4)}</div></div>
        <div class="metric"><div class="metric-name">Slope p-value</div><div class="metric-val ${lr.pSlope<0.05?'c-green':'c-red'}">${lr.pSlope<0.001?lr.pSlope.toExponential(2):lr.pSlope.toFixed(4)}</div><div class="metric-sub">t = ${lr.tSlope.toFixed(3)}, df = ${lr.df}</div></div>
        <div class="metric"><div class="metric-name">RMSE</div><div class="metric-val">${lr.rmse.toFixed(4)}</div><div class="metric-sub">Typical prediction error</div></div>
      </div>

      <div class="grid-2">
        <div class="chart-box">
          <div class="chart-box-title">Scatter plot with regression line</div>
          <div class="chart-wrap" style="height:280px"><canvas id="regScatter"></canvas></div>
        </div>
        <div class="chart-box">
          <div class="chart-box-title">Residual plot (fitted vs residual)</div>
          <div class="chart-wrap" style="height:280px"><canvas id="regResidual"></canvas></div>
        </div>
      </div>

      <div class="callout ${lr.pSlope<0.05 ? 'callout-good' : 'callout-warn'} mt-3">
        <div class="callout-title">Interpretation</div>
        <div class="callout-body">
          ${lr.pSlope < 0.05
            ? `The relationship between <strong>${this.esc(a.columns[xIdx].name)}</strong> and <strong>${this.esc(a.columns[yIdx].name)}</strong> is statistically significant (p = ${lr.pSlope<0.001?lr.pSlope.toExponential(2):lr.pSlope.toFixed(3)}). Each 1-unit increase in ${this.esc(a.columns[xIdx].name)} is associated with a ${lr.slope>0?'+':''}${lr.slope.toFixed(3)} change in ${this.esc(a.columns[yIdx].name)}. R\u00b2 = ${(lr.r2*100).toFixed(1)}% — ${lr.r2>0.7?'strong':lr.r2>0.4?'moderate':'weak'} predictive power. Check the residual plot: if residuals scatter randomly around zero, the linear model is appropriate.`
            : `No statistically significant linear relationship (p = ${lr.pSlope.toFixed(3)} ≥ 0.05). Either the variables are unrelated, the relationship is non-linear, or you need more data (n = ${lr.n}). Try a different predictor or check the scatter plot for non-linear patterns.`}
        </div>
      </div>
    </div>
  `;
};
App.drawSimpleReg = function(){
  if(!window.Chart) return;
  const a = this.regAligned();
  if(a.n < 3) return;
  const xIdx = this.state.regSimpleX || 0;
  const yIdx = this.current().regression.responseIndex;
  if(xIdx === yIdx) return;
  const x = a.columns[xIdx].values;
  const y = a.columns[yIdx].values;
  const lr = SS.linReg(x, y);
  if(!lr || lr.err) return;

  const points = x.map((xi,i)=>({x:xi, y:y[i]}));
  const xMin = Math.min(...x), xMax = Math.max(...x);
  const lineData = [
    { x: xMin, y: lr.intercept + lr.slope*xMin },
    { x: xMax, y: lr.intercept + lr.slope*xMax }
  ];
  const sc = document.getElementById('regScatter');
  if(sc){
    new Chart(sc, {
      data: {
        datasets: [
          { type:'scatter', label:'Data', data:points, backgroundColor:'#7c2d12', pointRadius:4 },
          { type:'line', label:'Fit', data:lineData, borderColor:'#15803d', borderWidth:2, pointRadius:0, fill:false }
        ]
      },
      options: { responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}} },
        scales:{
          x:{ type:'linear', title:{display:true,text:a.columns[xIdx].name,font:{size:10}}, ticks:{font:{size:10}} },
          y:{ title:{display:true,text:a.columns[yIdx].name,font:{size:10}}, ticks:{font:{size:10}} }
        }
      }
    });
  }
  // Residual plot
  const resPts = lr.fitted.map((f,i)=>({x:f, y:lr.resid[i]}));
  const rc = document.getElementById('regResidual');
  if(rc){
    new Chart(rc, {
      data: {
        datasets: [
          { type:'scatter', label:'Residual', data:resPts, backgroundColor:'#1d4ed8', pointRadius:4 },
          { type:'line', label:'Zero', data:[{x:Math.min(...lr.fitted),y:0},{x:Math.max(...lr.fitted),y:0}], borderColor:'#dc2626', borderWidth:1, borderDash:[4,4], pointRadius:0 }
        ]
      },
      options: { responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}} },
        scales:{
          x:{ type:'linear', title:{display:true,text:'Fitted value',font:{size:10}}, ticks:{font:{size:10}} },
          y:{ title:{display:true,text:'Residual',font:{size:10}}, ticks:{font:{size:10}} }
        }
      }
    });
  }
};

/* ----- REG: MULTIPLE LINEAR REGRESSION ----- */
App.renderMultiReg = function(){
  const a = this.regAligned();
  if(a.n < 4){
    return `<div class="callout callout-info"><div class="callout-title">Need more data</div><div class="callout-body">Multiple regression needs at least n > k+1 rows (and preferably 10+ per predictor). Currently ${a.n}.</div></div>`;
  }
  const yIdx = this.current().regression.responseIndex;
  const xCols = a.columns.filter((_,i) => i !== yIdx);
  if(xCols.length < 2){
    return `<div class="callout callout-info"><div class="callout-title">Need more predictors</div><div class="callout-body">Multiple regression needs at least 2 X variables. Add columns on the Data tab.</div></div>`;
  }
  const yName = a.columns[yIdx].name;
  const Y = a.columns[yIdx].values;
  const X = [];
  for(let i=0; i<a.n; i++){
    X.push(xCols.map(c => c.values[i]));
  }
  const mr = SS.multiReg(X, Y);
  if(mr.err){
    return `<div class="callout callout-bad"><div class="callout-body">${mr.err}</div></div>`;
  }
  const xNames = xCols.map(c => c.name);
  // Standardized coefficients (rough proxy for importance)
  const sd = (arr) => SS.stdev(arr);
  const sdY = sd(Y);
  const standardized = xNames.map((nm,i) => {
    const xVals = X.map(r => r[i]);
    const sdX = sd(xVals);
    return mr.beta[i+1] * (sdX / sdY);
  });
  const ranked = xNames
    .map((nm,i) => ({ name: nm, beta: mr.beta[i+1], se: mr.se[i+1], t: mr.tvals[i+1], p: mr.pvals[i+1], stdBeta: standardized[i] }))
    .sort((a,b) => Math.abs(b.stdBeta) - Math.abs(a.stdBeta));

  return `
    <div class="card">
      <div class="card-title">Multiple Linear Regression — predicting <em>${this.esc(yName)}</em></div>
      <div class="text-sm tx-3 mb-3">n = ${mr.n} observations, k = ${mr.k} predictors, df residual = ${mr.df}.</div>

      <div class="grid-4 mb-4">
        <div class="metric"><div class="metric-name">R\u00b2</div><div class="metric-val ${mr.r2>0.7?'c-green':mr.r2>0.4?'c-amber':'c-red'}">${mr.r2.toFixed(4)}</div><div class="metric-sub">${this.fmtPct(mr.r2*100,1)} explained</div></div>
        <div class="metric"><div class="metric-name">Adj R\u00b2</div><div class="metric-val">${mr.adjR2.toFixed(4)}</div><div class="metric-sub">Penalized for k</div></div>
        <div class="metric"><div class="metric-name">F-statistic</div><div class="metric-val">${mr.F.toFixed(2)}</div><div class="metric-sub">df = ${mr.k}, ${mr.df}</div></div>
        <div class="metric"><div class="metric-name">Model p-value</div><div class="metric-val ${mr.pF<0.05?'c-green':'c-red'}">${mr.pF<0.001?mr.pF.toExponential(2):mr.pF.toFixed(4)}</div><div class="metric-sub">Overall significance</div></div>
      </div>

      <div class="h3">Coefficient table</div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr>
            <th>Term</th>
            <th class="text-right">Coefficient</th>
            <th class="text-right">Std Error</th>
            <th class="text-right">t</th>
            <th class="text-right">p-value</th>
            <th class="text-right">Std β</th>
            <th>Significant</th>
          </tr></thead>
          <tbody>
            <tr>
              <td><strong>(Intercept)</strong></td>
              <td class="text-right text-mono">${mr.beta[0].toFixed(4)}</td>
              <td class="text-right text-mono">${mr.se[0].toFixed(4)}</td>
              <td class="text-right text-mono">${mr.tvals[0].toFixed(3)}</td>
              <td class="text-right text-mono">${mr.pvals[0]<0.001?mr.pvals[0].toExponential(2):mr.pvals[0].toFixed(4)}</td>
              <td class="text-right tx-3">—</td>
              <td>${mr.pvals[0]<0.05?'<span class="badge badge-good">yes</span>':'<span class="badge badge-warn">no</span>'}</td>
            </tr>
            ${xNames.map((nm,i)=>{
              const j = i+1;
              const sig = mr.pvals[j]<0.05;
              return `<tr ${sig?'class="row-good"':''}>
                <td>${this.esc(nm)}</td>
                <td class="text-right text-mono">${mr.beta[j].toFixed(4)}</td>
                <td class="text-right text-mono">${mr.se[j].toFixed(4)}</td>
                <td class="text-right text-mono">${mr.tvals[j].toFixed(3)}</td>
                <td class="text-right text-mono">${mr.pvals[j]<0.001?mr.pvals[j].toExponential(2):mr.pvals[j].toFixed(4)}</td>
                <td class="text-right text-mono">${standardized[i].toFixed(3)}</td>
                <td>${sig?'<span class="badge badge-good">yes</span>':'<span class="badge badge-warn">no</span>'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>

      <div class="h3 mt-4">Predictor ranking (by standardized β)</div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>Rank</th><th>Predictor</th><th class="text-right">|Std β|</th><th>p-value</th><th>Verdict</th></tr></thead>
          <tbody>
          ${ranked.map((r,i)=>`
            <tr>
              <td class="text-mono">${i+1}</td>
              <td><strong>${this.esc(r.name)}</strong></td>
              <td class="text-right text-mono">${Math.abs(r.stdBeta).toFixed(3)}</td>
              <td class="text-right text-mono">${r.p<0.001?r.p.toExponential(2):r.p.toFixed(4)}</td>
              <td>${r.p<0.05?'<span class="badge badge-good">significant driver</span>':'<span class="badge badge-warn">not significant</span>'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>

      <div class="grid-2 mt-4">
        <div class="chart-box">
          <div class="chart-box-title">Residual vs Fitted</div>
          <div class="chart-wrap" style="height:260px"><canvas id="multiResid"></canvas></div>
        </div>
        <div class="chart-box">
          <div class="chart-box-title">Observed vs Predicted</div>
          <div class="chart-wrap" style="height:260px"><canvas id="multiObsPred"></canvas></div>
        </div>
      </div>

      <div class="callout ${mr.pF<0.05?'callout-good':'callout-warn'} mt-3">
        <div class="callout-title">Model summary</div>
        <div class="callout-body">
          ${mr.pF < 0.05 ?
            `The model is statistically significant (F = ${mr.F.toFixed(2)}, p = ${mr.pF<0.001?mr.pF.toExponential(2):mr.pF.toFixed(4)}). Predictors together explain <strong>${(mr.r2*100).toFixed(1)}%</strong> of the variation in ${this.esc(yName)}. Top driver: <strong>${this.esc(ranked[0].name)}</strong>. Inspect the residual plot — if there's a pattern (curve, fan-out), consider transformations or interactions.`
            : `The overall model is not significant (p = ${mr.pF.toFixed(3)} \u2265 0.05). Either no real relationship exists, you need more data, or the wrong predictors are included.`}
        </div>
      </div>

      <div class="callout callout-info mt-3">
        <div class="callout-title">What to do with this model</div>
        <div class="callout-body">
          ${mr.pF < 0.05 ? `
            <strong>1. Focus improvement efforts on the top driver(s).</strong> The standardized \u03B2 column ranks predictors by influence per standard-deviation move. ${ranked.filter(r => r.p<0.05).length > 0 ? `Significant drivers: ${ranked.filter(r => r.p<0.05).map(r => '<strong>'+this.esc(r.name)+'</strong>').join(', ')}.` : ''} Variables with p &gt; 0.05 are noise \u2014 spending money to control them is wasted effort.
            <br><br>
            <strong>2. Tighten input control on the dominant predictor.</strong> If ${this.esc(ranked[0].name)} drives ${this.esc(yName)} with coefficient ${this.fmt(ranked[0].beta,3)}, each 1-unit reduction in its variation reduces output variation by approximately the same factor. Specify tighter tolerances at the upstream stage.
            <br><br>
            <strong>3. Use the Parameter Optimizer</strong> (in the Anomaly Detection module) to find the predictor settings that hit your target ${this.esc(yName)} value. The optimizer uses this same regression equation as its objective function.
            <br><br>
            <strong>4. Validate with a confirmation run.</strong> Predict the output for a planned setting, then run a pilot at that setting and compare actual vs predicted. If the prediction holds, the model is operationally usable; if not, there's a missing variable.
          ` : `
            <strong>Do not act on these coefficients.</strong> With p = ${mr.pF.toFixed(3)}, you cannot distinguish this model from noise. Three possible causes:
            <br><br>
            <strong>1. Wrong predictors.</strong> Your real drivers may not be in the dataset. Brainstorm with the Fishbone module, then add the missing columns and re-run.
            <br><br>
            <strong>2. Too little data.</strong> With ${mr.n} observations and ${mr.k} predictors, you have ${mr.df} degrees of freedom. Aim for at least 10 observations per predictor; if you have 3 predictors, target 30+ rows.
            <br><br>
            <strong>3. Non-linear relationship.</strong> Linear regression won't catch curvature. Examine the residual-vs-fitted plot for U-shapes or fans.
          `}
        </div>
      </div>
    </div>
  `;
};
App.drawMultiReg = function(){
  if(!window.Chart) return;
  const a = this.regAligned();
  if(a.n < 4) return;
  const yIdx = this.current().regression.responseIndex;
  const xCols = a.columns.filter((_,i) => i !== yIdx);
  if(xCols.length < 2) return;
  const Y = a.columns[yIdx].values;
  const X = [];
  for(let i=0; i<a.n; i++){
    X.push(xCols.map(c => c.values[i]));
  }
  const mr = SS.multiReg(X, Y);
  if(mr.err) return;

  const resPts = mr.fitted.map((f,i)=>({x:f, y:mr.resid[i]}));
  const rc = document.getElementById('multiResid');
  if(rc){
    new Chart(rc, {
      data:{ datasets:[
        { type:'scatter', label:'Residual', data:resPts, backgroundColor:'#1d4ed8', pointRadius:4 },
        { type:'line', label:'Zero', data:[{x:Math.min(...mr.fitted),y:0},{x:Math.max(...mr.fitted),y:0}], borderColor:'#dc2626', borderWidth:1, borderDash:[4,4], pointRadius:0 }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}} },
        scales:{ x:{type:'linear',title:{display:true,text:'Fitted',font:{size:10}},ticks:{font:{size:10}}}, y:{title:{display:true,text:'Residual',font:{size:10}},ticks:{font:{size:10}}} }
      }
    });
  }
  const obsPredPts = mr.fitted.map((f,i)=>({x:f, y:Y[i]}));
  const lo = Math.min(...mr.fitted, ...Y), hi = Math.max(...mr.fitted, ...Y);
  const oc = document.getElementById('multiObsPred');
  if(oc){
    new Chart(oc, {
      data:{ datasets:[
        { type:'scatter', label:'Observed', data:obsPredPts, backgroundColor:'#7c2d12', pointRadius:4 },
        { type:'line', label:'Perfect prediction', data:[{x:lo,y:lo},{x:hi,y:hi}], borderColor:'#15803d', borderWidth:1.5, borderDash:[4,4], pointRadius:0 }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}} },
        scales:{ x:{type:'linear',title:{display:true,text:'Predicted',font:{size:10}},ticks:{font:{size:10}}}, y:{title:{display:true,text:'Observed',font:{size:10}},ticks:{font:{size:10}}} }
      }
    });
  }
};

App.switchAnomalyTab = function(t){

/* ----- Tab 2: Live Monitoring ----- */
App.renderLiveMonitoring = function(){
  const p = this.current();
  if(this.state.liveReadings == null) this.state.liveReadings = [];
  const baseline = (p.measure.data.baseline || []).map(r => r.value).filter(v => !isNaN(v));
  if(baseline.length < 8){
    return `<div class="callout callout-info"><div class="callout-title">Baseline required</div><div class="callout-body">Live monitoring evaluates new readings against the baseline phase. Add at least 8 baseline observations on the Measure tab.</div></div>`;
  }
  const target = SS.mean(baseline);
  const sigma = SS.iMRChart(baseline).sigma;
  const live = this.state.liveReadings;

  // Evaluate each live reading
  const flags = live.map((v,i) => {
    const z = (v - target) / sigma;
    const beyond3 = Math.abs(z) > 3;
    const beyond2 = Math.abs(z) > 2;
    // Run trend rule on the live stream so far
    const stream = live.slice(0, i+1);
    let trend = false;
    if(stream.length >= 8){
      const last8 = stream.slice(-8);
      if(last8.every(x => x > target) || last8.every(x => x < target)) trend = true;
    }
    return { v, z, beyond3, beyond2, trend };
  });

  return `
    <div class="callout callout-info">
      <div class="callout-title">Live monitoring mode</div>
      <div class="callout-body">New readings are evaluated in real time against the baseline (\u03BC = ${target.toFixed(3)}, \u03C3 = ${sigma.toFixed(3)}). Use this to test what happens when you add observations one by one \u2014 simulating a live shift.</div>
    </div>

    <div class="card">
      <div class="card-title">Add new reading</div>
      <div class="flex gap-2 mb-3">
        <input class="input" id="live-input" type="number" step="any" placeholder="Enter value..." style="max-width:200px">
        <button class="btn btn-primary" onclick="App.addLiveReading()">+ Add reading</button>
        <button class="btn" onclick="App.simulateLiveStream()">\u26A1 Simulate 10 normal</button>
        <button class="btn btn-danger" onclick="App.state.liveReadings=[];App.renderAnomalyTab()">Clear</button>
      </div>

      <div class="chart-box">
        <div class="chart-box-title">Live stream against baseline limits</div>
        <div class="chart-wrap" style="height:280px"><canvas id="liveChart"></canvas></div>
      </div>

      ${live.length > 0 ? `
        <div class="h3 mt-3">Reading log (${live.length})</div>
        <div class="tbl-wrap" style="max-height:300px;overflow-y:auto">
          <table class="tbl">
            <thead><tr><th>#</th><th class="text-right">Value</th><th class="text-right">Z-score</th><th>Status</th></tr></thead>
            <tbody>
            ${flags.slice().reverse().map((f, idx) => {
              const realIdx = flags.length - 1 - idx;
              const status = f.beyond3 ? ['BEYOND 3\u03C3','badge-bad'] :
                             f.beyond2 ? ['beyond 2\u03C3','badge-warn'] :
                             f.trend   ? ['trend rule','badge-warn'] :
                                         ['normal','badge-good'];
              return `<tr>
                <td class="text-mono">${realIdx+1}</td>
                <td class="text-right text-mono">${f.v.toFixed(3)}</td>
                <td class="text-right text-mono">${f.z.toFixed(2)}</td>
                <td><span class="badge ${status[1]}">${status[0]}</span></td>
              </tr>`;
            }).join('')}
            </tbody>
          </table>
        </div>
      ` : ''}
    </div>
  `;
};
App.addLiveReading = function(){
  const inp = document.getElementById('live-input');
  const v = parseFloat(inp.value);
  if(isNaN(v)){ this.toast('Enter a number'); return; }
  this.state.liveReadings.push(v);
  inp.value = '';
  this.renderAnomalyTab();
};
App.simulateLiveStream = function(){
  const p = this.current();
  const baseline = (p.measure.data.baseline || []).map(r => r.value).filter(v => !isNaN(v));
  if(baseline.length < 8) return;
  const target = SS.mean(baseline);
  const sigma = SS.iMRChart(baseline).sigma;
  const rn = () => { let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  for(let i = 0; i < 10; i++){
    this.state.liveReadings.push(parseFloat((target + rn()*sigma).toFixed(3)));
  }
  this.renderAnomalyTab();
};
App.drawLiveMonitoring = function(){
  if(!window.Chart) return;
  const p = this.current();
  const baseline = (p.measure.data.baseline || []).map(r => r.value).filter(v => !isNaN(v));
  if(baseline.length < 8) return;
  const target = SS.mean(baseline);
  const sigma = SS.iMRChart(baseline).sigma;
  const live = this.state.liveReadings;
  const canvas = document.getElementById('liveChart');
  if(!canvas) return;
  const labels = live.map((_,i) => i+1);
  new Chart(canvas, {
    type:'line',
    data:{ labels: labels.length ? labels : ['—'],
      datasets:[
        { label:'Live reading', data:live, borderColor:'#7c2d12', backgroundColor:'rgba(124,45,18,.06)', borderWidth:1.5,
          pointRadius: live.map(v => Math.abs((v-target)/sigma) > 3 ? 6 : Math.abs((v-target)/sigma) > 2 ? 5 : 3),
          pointBackgroundColor: live.map(v => Math.abs((v-target)/sigma) > 3 ? '#dc2626' : Math.abs((v-target)/sigma) > 2 ? '#b45309' : '#15803d'),
          fill:false, tension:.05 },
        { label:'+3σ', data:Array(Math.max(1,live.length)).fill(target+3*sigma), borderColor:'#dc2626', borderWidth:1, borderDash:[6,3], pointRadius:0 },
        { label:'-3σ', data:Array(Math.max(1,live.length)).fill(target-3*sigma), borderColor:'#dc2626', borderWidth:1, borderDash:[6,3], pointRadius:0 },
        { label:'Target', data:Array(Math.max(1,live.length)).fill(target), borderColor:'#15803d', borderWidth:1, borderDash:[2,2], pointRadius:0 }
      ]
    },
    options:{ responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{ legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}} },
      scales:{ x:{ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}} }
    }
  });
};

/* ----- Tab 3: Root Cause Recommendation Engine ----- */
App.renderRecommendations = function(){
  const p = this.current();
  const baseline = (p.measure.data[this.state.anomalyPhase || 'baseline'] || []).map(r => r.value).filter(v => !isNaN(v));
  const ctq = p.define.ctq;

  if(baseline.length < 8){
    return `<div class="callout callout-info"><div class="callout-body">Add baseline data to enable recommendations.</div></div>`;
  }

  const target = SS.mean(baseline);
  const sigma = SS.iMRChart(baseline).sigma;
  const result = SS.detectAnomalies(baseline, target, sigma);

  // Determine dominant anomaly direction
  let dirAbove = 0, dirBelow = 0;
  result.anomalies.forEach(a => { if(a.value > target) dirAbove++; else dirBelow++; });
  const dominantDir = dirAbove > dirBelow ? 'above' : dirBelow > dirAbove ? 'below' : 'mixed';

  // Build recommendations from project knowledge
  const recommendations = this.buildRecommendations(p, result, dominantDir, ctq);

  return `
    <div class="callout callout-info mb-3">
      <div class="callout-title">How this works</div>
      <div class="callout-body">The recommendation engine cross-references three project artifacts to suggest likely root causes: <strong>(1)</strong> the Fishbone diagram in your Analyze module, <strong>(2)</strong> Pareto rankings, and <strong>(3)</strong> the regression model's predictor coefficients. It does not invent causes \u2014 only ranks what you've already documented based on observed anomaly patterns.</div>
    </div>

    <div class="grid-4 mb-4">
      <div class="metric"><div class="metric-name">Anomalies detected</div><div class="metric-val ${result.anomalies.length>0?'c-amber':'c-green'}">${result.anomalies.length}</div></div>
      <div class="metric"><div class="metric-name">Direction</div><div class="metric-val" style="font-size:16px">${dominantDir==='above'?'\u2191 above target':dominantDir==='below'?'\u2193 below target':'mixed'}</div></div>
      <div class="metric"><div class="metric-name">Change point</div><div class="metric-val">${result.changePoint?.detected ? 'at obs '+(result.changePoint.index+1) : 'none'}</div></div>
      <div class="metric"><div class="metric-name">Recommendations</div><div class="metric-val c-accent">${recommendations.length}</div></div>
    </div>

    ${recommendations.length === 0 ? `
      <div class="callout callout-info">
        <div class="callout-title">No recommendations available</div>
        <div class="callout-body">Either no anomalies were detected, or the project doesn't have enough source data to draw on. To get recommendations, add: <strong>(a)</strong> Fishbone causes in the Analyze module, <strong>(b)</strong> Pareto categories, or <strong>(c)</strong> regression predictors.</div>
      </div>
    ` : `
      <div class="card">
        <div class="card-title">Ranked root-cause suggestions</div>
        <div class="text-sm tx-3 mb-3">Each suggestion shows where it came from and a confidence band. Higher confidence = more independent project evidence.</div>
        ${recommendations.map((r,i) => `
          <div class="callout ${r.confidence>=0.7?'callout-good':r.confidence>=0.4?'callout-warn':'callout-info'}" style="margin-bottom:12px">
            <div class="callout-title">
              <span class="text-mono" style="margin-right:8px">#${i+1}</span>
              ${this.esc(r.cause)}
              <span class="badge ${r.confidence>=0.7?'badge-good':r.confidence>=0.4?'badge-warn':'badge-info'}" style="float:right">
                ${(r.confidence*100).toFixed(0)}% confidence
              </span>
            </div>
            <div class="callout-body">
              <div class="mb-2"><strong>Evidence:</strong></div>
              <ul style="margin-left:20px;font-size:13px;line-height:1.7">
                ${r.evidence.map(e => '<li>' + this.esc(e) + '</li>').join('')}
              </ul>
              ${r.action ? `<div class="mt-2"><strong>Suggested action:</strong> ${this.esc(r.action)}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    `}

    <div class="callout">
      <div class="callout-title">Engine logic (transparent, not a black box)</div>
      <div class="callout-body">
        Causes ranked by combining: <strong>(a)</strong> Pareto frequency (the more often it's been the cause historically, the higher the prior), <strong>(b)</strong> regression evidence (predictors with p&lt;0.05 in the multiple regression elevate causes whose Fishbone branch matches the predictor name), <strong>(c)</strong> direction match (an "above target" anomaly favors causes that push the CTQ up, where directionality can be inferred from the regression slope). All causes shown are from your Fishbone \u2014 nothing is invented.
      </div>
    </div>
  `;
};
App.buildRecommendations = function(p, anomalyResult, direction, ctq){
  // Pull all causes from Fishbone
  const fishCauses = [];
  Object.entries(p.analyze.fishbone || {}).forEach(([branch, list]) => {
    (list || []).forEach(cause => {
      fishCauses.push({ cause, branch });
    });
  });

  if(fishCauses.length === 0 || anomalyResult.anomalies.length === 0) return [];

  // Pareto: assume top categories correspond to dominant Fishbone branches
  const paretoTotal = (p.analyze.pareto || []).reduce((s,x) => s+x.count, 0) || 1;
  const paretoMap = {};
  (p.analyze.pareto || []).forEach(pr => {
    paretoMap[pr.category.toLowerCase()] = pr.count / paretoTotal;
  });

  // Regression: which predictors are significant?
  const regCols = p.regression?.columns || [];
  const yIdx = p.regression?.responseIndex ?? regCols.length-1;
  let regSignificant = [];
  if(regCols.length >= 3){
    const aligned = (() => {
      const n = Math.max(...regCols.map(c => c.values.length));
      const out = regCols.map(() => []);
      for(let i=0; i<n; i++){
        if(regCols.every(c => c.values[i] != null && !isNaN(c.values[i]))){
          regCols.forEach((c,j) => out[j].push(c.values[i]));
        }
      }
      return out;
    })();
    if(aligned[0]?.length >= 5){
      const Y = aligned[yIdx];
      const X = [];
      for(let i=0; i<aligned[0].length; i++){
        X.push(aligned.filter((_,j)=>j!==yIdx).map(col => col[i]));
      }
      const mr = SS.multiReg(X, Y);
      if(!mr.err){
        const xNames = regCols.filter((_,i)=>i!==yIdx).map(c => c.name);
        regSignificant = xNames.map((nm,i) => ({
          name: nm,
          beta: mr.beta[i+1],
          pValue: mr.pvals[i+1],
          significant: mr.pvals[i+1] < 0.05
        })).filter(r => r.significant);
      }
    }
  }

  // Score each Fishbone cause
  const scored = fishCauses.map(fc => {
    let score = 0.2;  // baseline prior
    const evidence = [];

    // (a) Pareto bump: if any Pareto category contains a keyword from this cause
    const lcCause = fc.cause.toLowerCase();
    Object.entries(paretoMap).forEach(([cat, weight]) => {
      const catWords = cat.split(/\s+/).filter(w => w.length >= 4);
      const matched = catWords.some(w => lcCause.includes(w));
      if(matched){
        score += weight * 0.5;
        evidence.push(`Pareto category "${cat}" matches (${(weight*100).toFixed(0)}% frequency)`);
      }
    });

    // (b) Regression bump: if any significant predictor name appears in the cause
    regSignificant.forEach(r => {
      const lcName = r.name.toLowerCase();
      const words = lcName.split(/[\s\(\)\/%]+/).filter(w => w.length >= 4);
      if(words.some(w => lcCause.includes(w))){
        score += 0.3;
        const dir = r.beta > 0 ? 'increases' : 'decreases';
        evidence.push(`Regression predictor "${r.name}" is statistically significant (p=${r.pValue.toFixed(4)}, ${dir} response)`);
        // Direction match: if anomalies are above target and beta is positive, the cause increasing pushes us above
        if((direction === 'above' && r.beta > 0) || (direction === 'below' && r.beta < 0)){
          score += 0.15;
          evidence.push(`Direction matches: anomalies are ${direction} target, and this predictor pushes the response in that direction`);
        }
      }
    });

    // (c) Branch-direction heuristic
    if(direction === 'above' && /excess|too much|over|high|high-/i.test(fc.cause)){
      score += 0.1; evidence.push(`Cause language suggests an upward effect, matching anomaly direction (above target)`);
    }
    if(direction === 'below' && /low|insufficient|under|missing|gap|leak/i.test(fc.cause)){
      score += 0.1; evidence.push(`Cause language suggests a downward effect, matching anomaly direction (below target)`);
    }

    // Always provide some evidence
    if(evidence.length === 0){
      evidence.push(`Documented in Fishbone (${fc.branch} branch) but no Pareto or regression corroboration yet`);
    }

    return {
      cause: fc.cause,
      branch: fc.branch,
      confidence: Math.min(1, score),
      evidence,
      action: this.suggestActionFor(fc.branch)
    };
  });

  return scored.sort((a,b) => b.confidence - a.confidence).slice(0, 8);
};
App.suggestActionFor = function(branch){
  const map = {
    man: 'Standardize operator procedures; verify shift handover protocol; refresh training.',
    machine: 'Schedule equipment inspection and calibration; review maintenance records.',
    material: 'Tighten incoming-material acceptance criteria; check supplier consistency.',
    method: 'Document and standardize the SOP; introduce Poka-Yoke; verify recipe / setpoint.',
    measurement: 'Run a Gauge R&R (MSA module); recalibrate instruments on a fixed schedule.',
    environment: 'Investigate ambient conditions (temperature, humidity); seasonal pattern check.'
  };
  return map[branch] || null;
};

/* ----- Tab 4: Parameter Optimizer ----- */
App.renderOptimizer = function(){
  const p = this.current();
  const regCols = p.regression?.columns || [];
  const yIdx = p.regression?.responseIndex ?? regCols.length-1;

  if(regCols.length < 3){
    return `<div class="callout callout-info"><div class="callout-title">Build a regression model first</div><div class="callout-body">The optimizer uses the multiple regression model from the Regression module. Add at least 2 predictors and a response there.</div></div>`;
  }
  // Align data
  const n = Math.max(...regCols.map(c => c.values.length));
  const aligned = regCols.map(() => []);
  for(let i=0; i<n; i++){
    if(regCols.every(c => c.values[i] != null && !isNaN(c.values[i]))){
      regCols.forEach((c,j) => aligned[j].push(c.values[i]));
    }
  }
  if(aligned[0].length < 5){
    return `<div class="callout callout-info"><div class="callout-body">Need at least 5 complete rows in the Regression module.</div></div>`;
  }

  const Y = aligned[yIdx];
  const xCols = regCols.filter((_,i)=>i!==yIdx);
  const X = [];
  for(let i=0; i<aligned[0].length; i++){
    X.push(xCols.map(c => aligned[regCols.indexOf(c)][i]));
  }
  const mr = SS.multiReg(X, Y);
  if(mr.err){
    return `<div class="callout callout-bad"><div class="callout-body">${mr.err}</div></div>`;
  }

  // Default ranges = observed min/max for each predictor
  if(!this.state.optRanges) this.state.optRanges = {};
  const ranges = xCols.map((c, ci) => {
    const vals = aligned[regCols.indexOf(c)];
    const stored = this.state.optRanges[c.name];
    return {
      name: c.name,
      min: stored?.min ?? Math.min(...vals),
      max: stored?.max ?? Math.max(...vals)
    };
  });

  // Get target/goal
  if(!this.state.optGoal) this.state.optGoal = 'max';
  if(this.state.optTarget == null) this.state.optTarget = SS.mean(Y);

  const opt = SS.optimizeParameters(mr, ranges, this.state.optTarget, this.state.optGoal);

  return `
    <div class="callout callout-info mb-3">
      <div class="callout-title">How this works</div>
      <div class="callout-body">Uses the multiple regression model fitted on your Regression-module data to find predictor settings that maximize, minimize, or hit a target value of the response. Grid-search across the ranges below.</div>
    </div>

    <div class="card">
      <div class="card-title">Optimization goal</div>
      <div class="grid-3 mb-3">
        <div>
          <label class="label">Goal</label>
          <select class="select" onchange="App.state.optGoal=this.value;App.renderAnomalyTab()">
            <option value="max" ${this.state.optGoal==='max'?'selected':''}>Maximize ${this.esc(regCols[yIdx].name)}</option>
            <option value="min" ${this.state.optGoal==='min'?'selected':''}>Minimize ${this.esc(regCols[yIdx].name)}</option>
            <option value="target" ${this.state.optGoal==='target'?'selected':''}>Hit target value</option>
          </select>
        </div>
        ${this.state.optGoal === 'target' ? `
          <div>
            <label class="label">Target value</label>
            <input class="input" type="number" step="any" value="${this.state.optTarget}" onchange="App.state.optTarget=parseFloat(this.value);App.renderAnomalyTab()">
          </div>
        ` : ''}
      </div>

      <div class="h3 mt-3">Predictor ranges (search space)</div>
      <div class="text-sm tx-3 mb-2">By default = observed min/max. Tighten if your process can only operate in a narrower window.</div>
      <div class="tbl-wrap mb-3">
        <table class="tbl">
          <thead><tr><th>Predictor</th><th class="text-right">Min</th><th class="text-right">Max</th><th class="text-right">Observed range</th></tr></thead>
          <tbody>
          ${xCols.map((c,ci) => {
            const vals = aligned[regCols.indexOf(c)];
            const obs = `${Math.min(...vals).toFixed(2)} \u2192 ${Math.max(...vals).toFixed(2)}`;
            return `<tr>
              <td><strong>${this.esc(c.name)}</strong></td>
              <td class="text-right"><input type="number" step="any" class="tbl-fit" value="${ranges[ci].min}" onchange="App.setOptRange('${this.esc(c.name)}','min',this.value)"></td>
              <td class="text-right"><input type="number" step="any" class="tbl-fit" value="${ranges[ci].max}" onchange="App.setOptRange('${this.esc(c.name)}','max',this.value)"></td>
              <td class="text-right text-mono tx-3">${obs}</td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>

      ${opt.error ? `<div class="callout callout-bad"><div class="callout-body">${opt.error}</div></div>` : `
        <div class="callout callout-good">
          <div class="callout-title">Optimal settings (${opt.gridSize}-point grid in each dimension)</div>
          <div class="callout-body">
            <div class="text-mono" style="font-size:16px;color:var(--accent);font-weight:600;margin-bottom:8px">
              Predicted ${this.esc(regCols[yIdx].name)} = ${opt.predicted.toFixed(3)}
            </div>
            <div class="grid-${Math.min(opt.settings.length,4)}">
              ${opt.settings.map(s => `
                <div class="metric">
                  <div class="metric-name">${this.esc(s.name)}</div>
                  <div class="metric-val c-accent">${s.value.toFixed(3)}</div>
                </div>`).join('')}
            </div>
            <div class="mt-3 text-xs tx-3">
              Goal: ${this.state.optGoal === 'target' ? `hit target ${this.state.optTarget.toFixed(2)}` : this.state.optGoal} \u00B7
              Search space: ${ranges.map(r => `${r.name} \u2208 [${r.min.toFixed(2)}, ${r.max.toFixed(2)}]`).join(' \u00B7 ')}
            </div>
          </div>
        </div>
      `}
    </div>
  `;
};
App.setOptRange = function(name, field, val){
  if(!this.state.optRanges) this.state.optRanges = {};
  if(!this.state.optRanges[name]) this.state.optRanges[name] = {};
  this.state.optRanges[name][field] = parseFloat(val);
  this.renderAnomalyTab();
};

  const a = document.createElement('a');
  a.href = url; a.download = `${p.name.replace(/\W+/g,'_')}.json`; a.click();

App.importJSON = function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      data.id = 'p_' + Date.now();
      data.name = (data.name || 'Imported') + ' (imported)';
      this.state.projects.push(data);
      this.state.currentId = data.id;
      this.saveAll();
      this.renderSidebar();
      this.go('overview');
      this.toast('Project imported');
    } catch(err){ this.toast('Invalid JSON'); }
  };
  reader.readAsText(file);
};

      ${this.WIZARD_STEPS.map((s,i) => `
        <div class="wiz-step ${i+1<step?'done':i+1===step?'active':''}" onclick="App.wizGo(${i+1})">
          <span class="wiz-step-label">${i+1}. ${s.label}</span>
        </div>`).join('')}
    </div>
    <div style="margin-top:32px"></div>
    <div class="card">
      <div class="card-title">Step ${step} of ${this.WIZARD_STEPS.length} — <em>${this.WIZARD_STEPS[step-1].title}</em></div>
      <div id="wiz-body"></div>
      <div class="wiz-nav">
        <button class="btn ${step===1 ? 'btn-ghost':''}" ${step===1 ? 'disabled':''} onclick="App.wizGo(${step-1})">← Previous</button>
        <div class="text-xs tx-3" style="align-self:center">${this.WIZARD_STEPS[step-1].label} · ${step}/${this.WIZARD_STEPS.length}</div>
        ${step < this.WIZARD_STEPS.length ?
          `<button class="btn btn-primary" onclick="App.wizGo(${step+1})">Next →</button>` :
          `<button class="btn btn-primary" onclick="App.go('export')">Open Export →</button>`}
      </div>
    </div>
  `;
  this.renderWizardStep();
};
App.wizGo = function(step){
  if(step < 1 || step > this.WIZARD_STEPS.length) return;
  this.state.wizardStep = step;
  this.go('wizard');
};
App.renderWizardStep = function(){
  const p = this.current();
  const body = document.getElementById('wiz-body'); if(!body) return;
  const step = this.WIZARD_STEPS[this.state.wizardStep-1].key;

  switch(step){
    case 'problem':
      body.innerHTML = `
        <p class="lead">A good problem statement is specific, measurable, and free of assumed causes or solutions.</p>
        <div class="field">
          <label class="label">Problem Statement</label>
          <textarea class="textarea" oninput="App.current().define.problem=this.value;App.saveAll()" placeholder="Example: 'Our metallisation Cpk is 0.43 against the 85% LSL, generating off-grade DRI handling cost and customer complaint risk.'">${this.esc(p.define.problem||'')}</textarea>
        </div>
        <div class="field">
          <label class="label">Goal (what improvement, by when)</label>
          <textarea class="textarea" oninput="App.current().define.purpose=this.value;App.saveAll()" placeholder="Example: 'Increase Cpk to ≥ 1.0 within Q1 and ≥ 1.33 within Q4.'">${this.esc(p.define.purpose||'')}</textarea>
        </div>
      `;
      break;
    case 'ctq':
      body.innerHTML = `
        <p class="lead">The CTQ is the single measurable quality characteristic the project will track.</p>
        <div class="field-row">
          <div class="field"><label class="label">CTQ Name</label>
            <input class="input" value="${this.esc(p.define.ctq.name||'')}" oninput="App.current().define.ctq.name=this.value;App.saveAll()"></div>
          <div class="field"><label class="label">Unit</label>
            <input class="input" value="${this.esc(p.define.ctq.unit||'')}" oninput="App.current().define.ctq.unit=this.value;App.saveAll()"></div>
        </div>
        <div class="field-row">
          <div class="field"><label class="label">LSL (lower spec)</label>
            <input class="input" type="number" step="any" value="${p.define.ctq.lsl??''}" oninput="App.current().define.ctq.lsl = this.value===''?null:parseFloat(this.value);App.saveAll()"></div>
          <div class="field"><label class="label">USL (upper spec)</label>
            <input class="input" type="number" step="any" value="${p.define.ctq.usl??''}" oninput="App.current().define.ctq.usl = this.value===''?null:parseFloat(this.value);App.saveAll()"></div>
        </div>
      `;
      break;
    case 'data':
      body.innerHTML = `
        <p class="lead">Add baseline observations — values measured before any improvements. Paste from Excel or generate test data.</p>
        <div class="field">
          <label class="label">Paste values (any separator)</label>
          <textarea class="textarea" id="wiz-paste" rows="6" placeholder="86.5, 87.2, 85.9, 88.1, 86.8…"></textarea>
        </div>
        <div class="flex gap-2 mb-3">
          <button class="btn btn-primary" onclick="App.state.currentPhase='baseline';App.wizPaste()">Use as baseline</button>
          <button class="btn" onclick="App.state.currentPhase='baseline';App.wizGenerate()">⚡ Generate test data</button>
        </div>
        <div class="text-xs tx-3">Currently: <strong>${this.currentData('baseline').length}</strong> baseline points · <strong>${this.currentData('implemented').length}</strong> implemented points.</div>
      `;
      break;
    case 'capab':
      body.innerHTML = `
        <p class="lead">Capability analysis tells you how the process performs against its spec limits.</p>
        ${this.renderCapability(this.currentData('baseline'), p.define.ctq).replace('<div class="card">','<div>').replace('</div>\n    </div>','</div>')}
        <button class="btn mt-3" onclick="App.go('measure');App.switchMeasureTab('capability')">Open full Capability module →</button>
      `;
      setTimeout(()=>this.drawCapability(this.currentData('baseline'), p.define.ctq), 50);
      break;
    case 'root':
      body.innerHTML = `
        <p class="lead">Identify candidate root causes using the 6M Fishbone framework. Each category will hold a list of possible causes.</p>
        ${this.renderFishbone().replace('<div class="card">','<div>').replace(/<\/div>\s*$/,'')}
      `;
      break;
    case 'compare':
      body.innerHTML = `
        <p class="lead">Add Implemented-phase data on the Measure tab, then return here.</p>
        ${this.renderBeforeAfter().replace('<div class="card">','<div>').replace(/<\/div>\s*$/,'')}
      `;
      setTimeout(()=>this.drawBeforeAfter(), 50);
      break;
    case 'control':
      body.innerHTML = `
        <p class="lead">Document how you'll sustain the gains so the improvement does not regress.</p>
        ${this.renderControlPlanInline()}
      `;
      break;
    case 'done':
      body.innerHTML = `
        <p class="lead">Your project is complete. Export it for your portfolio, presentation, or backup.</p>
        <div class="grid-3">
          <button class="btn btn-primary" onclick="App.exportCharterPDF()">📄 PDF Charter</button>
          <button class="btn" onclick="App.exportA3()">🖨️ A3 Report</button>
          <button class="btn" onclick="App.exportJSON()">💾 JSON Backup</button>
        </div>
      `;
      break;
  }
};
App.renderControlPlanInline = function(){
  const p = this.current();
  return `
    <div class="card-title">Control Plan
      <button class="btn btn-sm" onclick="App.addControlRow();App.renderWizardStep()">+ Add element</button>
    </div>
    <div class="tbl-wrap">
      <table class="tbl tbl-edit">
        <thead><tr><th>Element</th><th>Metric</th><th>Freq.</th><th>Owner</th><th>Reaction</th><th class="tbl-action"></th></tr></thead>
        <tbody>
        ${p.control.plan.map((c,i)=>`
          <tr>
            <td><input value="${this.esc(c.element)}" oninput="App.current().control.plan[${i}].element=this.value;App.saveAll()"></td>
            <td><input value="${this.esc(c.metric)}" oninput="App.current().control.plan[${i}].metric=this.value;App.saveAll()"></td>
            <td><input value="${this.esc(c.frequency)}" oninput="App.current().control.plan[${i}].frequency=this.value;App.saveAll()"></td>
            <td><input value="${this.esc(c.owner)}" oninput="App.current().control.plan[${i}].owner=this.value;App.saveAll()"></td>
            <td><input value="${this.esc(c.reaction)}" oninput="App.current().control.plan[${i}].reaction=this.value;App.saveAll()"></td>
            <td class="tbl-action"><button class="btn-ghost btn-danger" onclick="App.current().control.plan.splice(${i},1);App.saveAll();App.renderWizardStep()">×</button></td>
          </tr>`).join('') || '<tr><td colspan="6" class="empty">No elements yet.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
};
App.wizPaste = function(){
  const ta = document.getElementById('wiz-paste');
  const values = this.parseInputData(ta.value);
  if(values.length === 0){ this.toast('No values found'); return; }
  const p = this.current();
  p.measure.data.baseline = values.map((v,i) => ({ shift:i+1, value:v, op:'', date:'', notes:'' }));
  this.saveAll();
  this.toast(`Loaded ${values.length} baseline points`);
  this.renderWizardStep();
};
App.wizGenerate = function(){
  const p = this.current();
  const lsl = p.define.ctq.lsl, usl = p.define.ctq.usl;
  const mean = lsl != null && usl != null ? (lsl+usl)/2 : (lsl != null ? lsl + 2 : (usl != null ? usl - 2 : 50));
  const sd = lsl != null && usl != null ? (usl-lsl)/8 : 1;
  const rn = () => { let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  p.measure.data.baseline = [];
  for(let i=0; i<30; i++){
    p.measure.data.baseline.push({ shift:i+1, value: parseFloat((mean+rn()*sd*2).toFixed(2)), op:'', date:'', notes:'' });
  }
  this.saveAll();
  this.toast('Generated 30 baseline points');
  this.renderWizardStep();
};

</script>
<script defer src="js/agents.js"></script>
</body>
