      if(pv) pv.textContent = `${parsed.length} value${parsed.length===1 ? '':'s'} detected`;
    });
  }
};
App.pasteData = function(replace=false){
  const ta = document.getElementById('paste-area');
  if(!ta) return;
  const values = this.parseInputData(ta.value);
  if(values.length === 0){ this.toast('No numeric values found'); return; }
  const phase = this.state.currentPhase;
  const p = this.current();
  if(replace) p.measure.data[phase] = [];
  values.forEach((v,i) => {
    const idx = (p.measure.data[phase]?.length || 0) + i + 1;
    p.measure.data[phase].push({ shift: idx, value: v, op:'', date:'', notes:'' });
  });
  this.saveAll();
  ta.value = '';
  this.toast(`${replace?'Replaced':'Appended'} ${values.length} values`);
  this.renderMeasureTab();
};
App.generateRandom = function(){
  const mean = parseFloat(document.getElementById('gen-mean').value);
  const sd = parseFloat(document.getElementById('gen-sd').value);
  const n = parseInt(document.getElementById('gen-n').value);
  if(isNaN(mean)||isNaN(sd)||isNaN(n)){ this.toast('Invalid generator params'); return; }
  const p = this.current();
  const phase = this.state.currentPhase;
  const rn = () => { let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  p.measure.data[phase] = [];
  for(let i=0; i<n; i++){
    p.measure.data[phase].push({ shift:i+1, value: parseFloat((mean+rn()*sd).toFixed(2)), op:'', date:'', notes:'' });
  }
  this.saveAll();
  this.toast(`Generated ${n} values`);
  this.renderMeasureTab();
};
App.addDataRow = function(){
  const p = this.current(); const phase = this.state.currentPhase;
  const next = (p.measure.data[phase]?.length || 0) + 1;
  p.measure.data[phase].push({ shift: next, value: 0, op:'', date:'', notes:'' });
  this.saveAll();
  this.renderMeasureTab();
};
App.updateRow = function(i, field, val){
  const p = this.current(); const phase = this.state.currentPhase;
  if(field === 'value') val = parseFloat(val);
  p.measure.data[phase][i][field] = val;
  this.saveAll();
};
App.deleteRow = function(i){
  const p = this.current(); const phase = this.state.currentPhase;
  p.measure.data[phase].splice(i, 1);
  this.saveAll();
  this.renderMeasureTab();
};
App.clearPhaseData = function(){
  if(!confirm('Clear all data in this phase?')) return;
  const p = this.current(); const phase = this.state.currentPhase;
  p.measure.data[phase] = [];
  this.saveAll();
  this.renderMeasureTab();
};

App.renderMeasureStats = function(values){
  const s = SS.describe(values);
  if(!s) return `<div class="callout callout-info"><div class="callout-title">Not enough data</div><div class="callout-body">Need at least 2 valid values. Add data in the Data Entry tab.</div></div>`;
  return `
    <div class="card">
      <div class="card-title">Descriptive Statistics</div>
      <div class="grid-4">
        ${[
          ['n', s.n, 'Sample size'],
          ['Mean (x̄)', this.fmt(s.mean,3), 'Arithmetic mean'],
          ['Std Dev (s)', this.fmt(s.stdev,3), 'Sample standard deviation'],
          ['Range', this.fmt(s.range,3), 'Max − Min'],
          ['Min', this.fmt(s.min,3), 'Smallest value'],
          ['Q1', this.fmt(s.q1,3), '25th percentile'],
          ['Median', this.fmt(s.median,3), '50th percentile'],
          ['Q3', this.fmt(s.q3,3), '75th percentile'],
          ['Max', this.fmt(s.max,3), 'Largest value'],
          ['CV', this.fmtPct(100*s.stdev/Math.abs(s.mean)), 'Coefficient of variation'],
          ['Skewness', this.fmt(this.calcSkew(values),3), '0 = symmetric'],
          ['Kurtosis', this.fmt(this.calcKurt(values),3), '0 = normal']
        ].map(([n,v,sub]) => `<div class="metric"><div class="metric-name">${n}</div><div class="metric-val">${v}</div><div class="metric-sub">${sub}</div></div>`).join('')}
      </div>
    </div>
  `;
};

App.calcSkew = function(arr){
  const m = SS.mean(arr); const s = SS.stdev(arr); const n = arr.length;
  if(s<1e-10||n<3) return 0;
  return (n/((n-1)*(n-2))) * arr.reduce((a,v) => a + Math.pow((v-m)/s,3), 0);
};
App.calcKurt = function(arr){
  const m = SS.mean(arr); const s = SS.stdev(arr); const n = arr.length;
  if(s<1e-10||n<4) return 0;
  const t = (n*(n+1)/((n-1)*(n-2)*(n-3))) * arr.reduce((a,v) => a + Math.pow((v-m)/s,4), 0);
  return t - (3*(n-1)*(n-1)/((n-2)*(n-3)));
};

App.capabilityOperationalImpact = function(c, ctq){
  // Translate Cpk + DPMO into shift-level / cost language
  const defectsPerShift = (c.dpmo / 1e6) * 100;
  const shiftsBeforeOne = c.dpmo > 0 ? Math.ceil(1e6 / c.dpmo / 100) : Infinity;
  const sideText = ctq.lsl != null && ctq.usl != null ? 'either limit'
    : ctq.lsl != null ? `the LSL of ${ctq.lsl}`
    : `the USL of ${ctq.usl}`;
  let txt = `At the current performance, an estimated <strong>${this.fmt(defectsPerShift,2)}%</strong> of observations will fall outside ${sideText} (\u2248 ${Math.round(c.dpmo).toLocaleString()} DPMO). `;
  if(c.dpmo > 100000){
    txt += `That's roughly <strong>1 defect every ${this.fmt(100/defectsPerShift,1)} observations</strong> \u2014 you should expect off-spec output on most shifts.`;
  } else if(c.dpmo > 10000){
    txt += `Expect off-spec output on most shifts.`;
  } else if(c.dpmo > 1000){
    txt += `Off-spec output is occasional but recurring. Look for special-cause patterns in the time-series and anomaly modules.`;
  } else if(c.dpmo > 10){
    txt += `Off-spec output is rare. Maintain capability via SPC and the Control Plan.`;
  } else {
    txt += `Defect rate is below most commercial quality thresholds. Lock in via the Control Plan.`;
  }
  // Append financial framing if user has supplied production economics
  const p = this.current();
  const cost = this.estimateCost(c, p?.financial);
  if(cost){
    txt += `<br><br><strong>Financial translation:</strong> At ${cost.annualUnits.toLocaleString('en-IN')} units / year and ${this.formatMoney(p.financial.costPerDefect, p.financial.currency)} per off-spec unit, this corresponds to roughly <strong>${this.formatMoney(cost.annualCost, p.financial.currency)} per year</strong> in recurring defect cost (\u2248 ${Math.round(cost.annualDefects).toLocaleString('en-IN')} off-spec units annually).`;
  }
  return txt;
};
App.drawCapability = function(values, ctq){
  if(values.length < 8 || !window.Chart) return;
  const c = SS.capability(values, ctq.lsl, ctq.usl);
  if(!c) return;
  const h = SS.histogram(values, Math.max(8, Math.min(15, Math.ceil(Math.sqrt(values.length)))));
  const centers = h.edges.slice(0,-1).map((e,i) => (e + h.edges[i+1])/2);
  const xs = [], pdf = [];
  const xMin = Math.min(c.mean-4*c.overallStdev, ctq.lsl!=null?ctq.lsl-0.5:Infinity);
  const xMax = Math.max(c.mean+4*c.overallStdev, ctq.usl!=null?ctq.usl+0.5:-Infinity);
  for(let x = xMin; x <= xMax; x += (xMax-xMin)/100){
    xs.push(x);
    pdf.push(SS.normPdf((x-c.mean)/c.overallStdev) / c.overallStdev);
  }
  const maxCount = Math.max(...h.counts);
  const maxPdf = Math.max(...pdf);
  const scaledPdf = pdf.map(v => v * (maxCount/maxPdf));

  const canvas = document.getElementById('capChart');
  if(!canvas) return;
  new Chart(canvas, {
    type:'bar',
    data:{
      labels: centers.map(c => c.toFixed(1)),
      datasets:[
        { label:'Frequency', data:h.counts, backgroundColor:'rgba(124,45,18,.4)', borderColor:'#7c2d12', borderWidth:1, yAxisID:'y' },
        { type:'line', label:'Normal fit', data: xs.map((x,i)=>({x:x,y:scaledPdf[i]})), borderColor:'#15803d', borderWidth:2, pointRadius:0, fill:false, yAxisID:'y' }
      ]
    },
    options:{ responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{ legend:{display:true, position:'bottom', labels:{font:{size:10}, boxWidth:8}},
        annotation:{} },
      scales:{
        x:{type:'linear', min:xMin, max:xMax, title:{display:true, text:ctq.name||'Value', font:{size:11}}, ticks:{font:{size:10}}},
        y:{display:true, ticks:{font:{size:10}}, title:{display:true, text:'Frequency', font:{size:11}}}
      }
    }
  });
  if(canvas.parentElement && (ctq.lsl != null || ctq.usl != null)){
    setTimeout(() => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:absolute;top:8px;right:8px;background:var(--surface-2);padding:4px 8px;border-radius:4px;font-family:var(--f-mono);font-size:10px;color:var(--tx-2);border:1px solid var(--bd)';
      overlay.innerHTML = `${ctq.lsl!=null?'LSL: '+ctq.lsl+' ':''}${ctq.usl!=null?'USL: '+ctq.usl:''}`;
      canvas.parentElement.style.position = 'relative';
      canvas.parentElement.appendChild(overlay);
    }, 100);
  }
};

App.renderNormality = function(values){

  const isNormal = ad.pValue > 0.05;
  return `
    <div class="card">
      <div class="card-title">Normality Assessment <span class="badge ${isNormal?'badge-good':'badge-warn'}">${ad.verdict}</span></div>
      <div class="grid-3 mb-3">
        <div class="metric"><div class="metric-name">Anderson-Darling A²</div><div class="metric-val">${this.fmt(ad.AD,3)}</div></div>
        <div class="metric"><div class="metric-name">p-value</div><div class="metric-val ${isNormal?'c-green':'c-red'}">${this.fmt(ad.pValue,4)}</div><div class="metric-sub">vs α = 0.05</div></div>
        <div class="metric"><div class="metric-name">n</div><div class="metric-val">${values.length}</div></div>
      </div>

        <div class="chart-wrap" style="height:240px"><canvas id="normHist"></canvas></div>
      </div>
      <div class="chart-box">
        <div class="chart-box-title">Normal Probability Plot (Q-Q)</div>
        <div class="chart-wrap" style="height:240px"><canvas id="qqPlot"></canvas></div>
      </div>
      <div class="callout ${isNormal?'callout-good':'callout-warn'}">
        <div class="callout-title">Interpretation</div>
        <div class="callout-body">
          ${isNormal
            ? `H₀ (data is normal) is not rejected. The standard Cpk calculation is valid for this dataset.`
            : `H₀ (data is normal) is rejected. Cpk results may misstate true capability. Investigate possible causes: special-cause variation, multiple modes, outliers, or a non-normal underlying process. Consider Box-Cox transformation or non-normal capability methods.`}
        </div>
      </div>
    </div>`;
};
App.drawNormality = function(values){
  if(values.length < 8 || !window.Chart) return;
  const m = SS.mean(values), s = SS.stdev(values);
  const h = SS.histogram(values, Math.max(6, Math.min(12, Math.ceil(Math.sqrt(values.length)))));
  const centers = h.edges.slice(0,-1).map((e,i) => (e + h.edges[i+1])/2);
  const xMin = m - 4*s, xMax = m + 4*s;
  const xs=[], ys=[];
  const binW = h.binWidth;
  for(let x = xMin; x <= xMax; x += (xMax-xMin)/100){
    xs.push(x);
    ys.push(SS.normPdf((x-m)/s) / s * values.length * binW);
  }
  const histCanvas = document.getElementById('normHist');
  if(histCanvas){
    new Chart(histCanvas, {
      type:'bar',
      data:{ labels: centers.map(c=>c.toFixed(2)),
        datasets:[
          { label:'Observed', data:h.counts, backgroundColor:'rgba(124,45,18,.35)', borderColor:'#7c2d12', borderWidth:1 },
          { type:'line', label:'Normal', data: xs.map((x,i)=>({x:x,y:ys[i]})), borderColor:'#15803d', borderWidth:2, pointRadius:0, fill:false }
        ]
      },
      options:{ responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}}},
        scales:{ x:{type:'linear', min:xMin, max:xMax, ticks:{font:{size:10}}}, y:{ticks:{font:{size:10}}} } }
    });
  }
  const qqCanvas = document.getElementById('qqPlot');
  if(qqCanvas){
    const sorted = [...values].sort((a,b)=>a-b);
    const n = sorted.length;
    const pts = sorted.map((v,i) => ({ x: SS.invNorm((i+0.5)/n), y: v }));
    const minTQ = Math.min(...pts.map(p=>p.x)), maxTQ = Math.max(...pts.map(p=>p.x));
    const line = [
      { x: minTQ, y: m + minTQ*s },
      { x: maxTQ, y: m + maxTQ*s }
    ];
    new Chart(qqCanvas, {
      type:'scatter',
      data:{ datasets:[
        { label:'Sample quantiles', data:pts, backgroundColor:'#7c2d12', pointRadius:3 },
        { type:'line', label:'Reference line', data:line, borderColor:'#15803d', borderWidth:1.5, pointRadius:0, fill:false }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}}},
        scales:{ x:{ticks:{font:{size:10}}, title:{display:true,text:'Theoretical normal quantile',font:{size:10}}},
                 y:{ticks:{font:{size:10}}, title:{display:true,text:'Sample value',font:{size:10}}} } }
    });
  }
};

/* ---------- TIME SERIES ---------- */
App.renderTimeSeries = function(values){
  if(values.length < 8){
    return `<div class="callout callout-info"><div class="callout-title">More data needed</div><div class="callout-body">Time-series analysis is reliable with at least 20 observations. You have ${values.length}.</div></div>`;
  }
  const mk = SS.mannKendall(values);
  const acf = SS.autocorrelation(values, Math.min(20, Math.floor(values.length/4)));
  // Suggested rolling window: ~10% of data, between 5 and 20
  const windowSize = Math.max(5, Math.min(20, Math.floor(values.length/10)));
  const roll = SS.rollingStats(values, windowSize);

  // Lag-1 autocorrelation flagging
  const acf1 = acf?.acf[1] ?? 0;
  const acfSig = Math.abs(acf1) > (acf?.ci ?? 0);

  return `
    <div class="card">
      <div class="card-title">Time-Series Analysis</div>
      <div class="text-sm tx-3 mb-3">Process data is rarely static. Check for trend (drift), autocorrelation (memory between consecutive readings), and rolling stability over time.</div>

      <div class="grid-4 mb-4">
        <div class="metric">
          <div class="metric-name">Trend (Mann-Kendall)</div>
          <div class="metric-val ${mk.pValue<0.05?'c-amber':'c-green'}" style="font-size:14px">${mk.verdict}</div>
          <div class="metric-sub">Z = ${mk.Z.toFixed(2)}, p = ${mk.pValue<0.001?mk.pValue.toExponential(2):mk.pValue.toFixed(3)}</div>
        </div>
        <div class="metric">
          <div class="metric-name">Sen's slope</div>
          <div class="metric-val">${mk.sensSlope.toFixed(4)}</div>
          <div class="metric-sub">per observation</div>
        </div>
        <div class="metric">
          <div class="metric-name">Lag-1 ACF</div>
          <div class="metric-val ${acfSig?'c-amber':'c-green'}">${acf1.toFixed(3)}</div>
          <div class="metric-sub">95% CI: \u00b1${(acf?.ci??0).toFixed(3)} \u2014 ${acfSig?'autocorrelated':'independent'}</div>
        </div>
        <div class="metric">
          <div class="metric-name">Rolling window</div>
          <div class="metric-val">${windowSize}</div>
          <div class="metric-sub">observations</div>
        </div>
      </div>

      <div class="chart-box">
        <div class="chart-box-title">Time series with rolling mean (n=${windowSize}) and \u00b13\u03c3 bands</div>
        <div class="chart-wrap" style="height:280px"><canvas id="tsChart"></canvas></div>
      </div>

      <div class="chart-box">
        <div class="chart-box-title">Autocorrelation Function (ACF)</div>
        <div class="text-xs tx-3 mb-2">Bars beyond the dashed bands (\u00b11.96/\u221an) indicate statistically significant autocorrelation at that lag. AR(1)-like processes show high lag-1 ACF with geometric decay.</div>
        <div class="chart-wrap" style="height:220px"><canvas id="acfChart"></canvas></div>
      </div>

      <div class="callout ${mk.pValue<0.05||acfSig?'callout-warn':'callout-good'}">
        <div class="callout-title">Interpretation</div>
        <div class="callout-body">
          ${mk.pValue<0.05 ? `<strong>Drift detected.</strong> Sen's slope ${mk.sensSlope>0?'+':''}${mk.sensSlope.toFixed(4)} per observation \u2014 the process is moving over time. Standard SPC assumes a stable mean; drift must be addressed (e.g. tool wear, seasonal effects, calibration loss) before declaring capability. ` : ''}
          ${acfSig ? `<strong>Autocorrelation present.</strong> Lag-1 ACF = ${acf1.toFixed(3)} exceeds the \u00b1${acf?.ci.toFixed(3)} threshold. Consecutive readings are not independent \u2014 standard control limits will over-flag. Consider EWMA charts or sampling further apart in time. ` : ''}
          ${!acfSig && mk.pValue>=0.05 ? `Process appears stationary and independent over time. Standard SPC and capability calculations are valid for this dataset.` : ''}
        </div>
      </div>
    </div>
  `;
};
App.drawTimeSeries = function(values){
  if(values.length < 8 || !window.Chart) return;
  const windowSize = Math.max(5, Math.min(20, Math.floor(values.length/10)));
  const roll = SS.rollingStats(values, windowSize);
  const acf = SS.autocorrelation(values, Math.min(20, Math.floor(values.length/4)));
  const mean = SS.mean(values), sd = SS.stdev(values);

  const tsCanvas = document.getElementById('tsChart');
  if(tsCanvas){
    const labels = values.map((_,i)=>i+1);
    // Rolling mean aligned to right edge of window
    const rollingMean = new Array(windowSize-1).fill(null).concat(roll.means);
    new Chart(tsCanvas, {
      type:'line',
      data:{
        labels,
        datasets:[
          { label:'Value', data:values, borderColor:'#7c2d12', backgroundColor:'rgba(124,45,18,.06)', borderWidth:1.2, pointRadius:2, tension:.05, fill:false },
          { label:`Rolling mean (n=${windowSize})`, data:rollingMean, borderColor:'#15803d', borderWidth:2, pointRadius:0, fill:false, spanGaps:false },
          { label:'+3σ', data:Array(values.length).fill(mean+3*sd), borderColor:'#dc2626', borderWidth:1, borderDash:[6,3], pointRadius:0 },
          { label:'-3σ', data:Array(values.length).fill(mean-3*sd), borderColor:'#dc2626', borderWidth:1, borderDash:[6,3], pointRadius:0 },
          { label:'Mean', data:Array(values.length).fill(mean), borderColor:'#1d4ed8', borderWidth:1, borderDash:[2,2], pointRadius:0 }
        ]
      },
      options:{ responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}} },
        scales:{ x:{ticks:{font:{size:10},maxTicksLimit:15}}, y:{ticks:{font:{size:10}}} }
      }
    });
  }

  const acfCanvas = document.getElementById('acfChart');
  if(acfCanvas && acf){
    const acfLabels = acf.acf.map((_,i)=>'lag '+i);
    new Chart(acfCanvas, {
      type:'bar',
      data:{
        labels:acfLabels,
        datasets:[
          { label:'ACF', data:acf.acf, backgroundColor:acf.acf.map(v=>Math.abs(v)>acf.ci?'#dc2626':'#7c2d12') },
          { type:'line', label:'+CI', data:Array(acf.acf.length).fill(acf.ci), borderColor:'#1d4ed8', borderWidth:1, borderDash:[4,3], pointRadius:0 },
          { type:'line', label:'-CI', data:Array(acf.acf.length).fill(-acf.ci), borderColor:'#1d4ed8', borderWidth:1, borderDash:[4,3], pointRadius:0 }
        ]
      },
      options:{ responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}} },
        scales:{ x:{ticks:{font:{size:10}}}, y:{min:-1,max:1,ticks:{font:{size:10}}} }
      }
    });
  }
};

App.switchAnalyzeTab = function(t){

/* ----- Pareto ----- */
App.renderPareto = function(){
  const p = this.current();
  const items = [...p.analyze.pareto].sort((a,b) => b.count - a.count);
  const total = items.reduce((a,x) => a + x.count, 0) || 1;
  let cum = 0;
  return `
    <div class="card">
      <div class="card-title">Pareto Analysis — defect / deviation categories
        <button class="btn btn-sm" onclick="App.addParetoRow()">+ Add row</button>
      </div>
      <div class="text-sm tx-3 mb-3">Enter each defect type and its count. The 80/20 rule typically holds — focus on the top 2 or 3 categories first.</div>
      <div class="tbl-wrap">
        <table class="tbl tbl-edit">
          <thead><tr><th style="width:50%">Category</th><th style="width:15%">Count</th><th style="width:15%">% Share</th><th style="width:15%">Cumulative</th><th class="tbl-action"></th></tr></thead>
          <tbody>
          ${items.map((it,i) => {
            const idx = p.analyze.pareto.indexOf(it);
            const pct = it.count/total*100;
            cum += pct;
            return `<tr ${cum<=80?'class="row-warn"':''}>
              <td><input value="${this.esc(it.category)}" oninput="App.current().analyze.pareto[${idx}].category=this.value;App.saveAll()"></td>
              <td><input type="number" value="${it.count}" oninput="App.current().analyze.pareto[${idx}].count=+this.value;App.saveAll();App.renderAnalyzeTab()"></td>
              <td class="tbl-num">${this.fmt(pct,1)}%</td>
              <td class="tbl-num">${this.fmt(cum,1)}%</td>
              <td class="tbl-action"><button class="btn-ghost btn-danger" onclick="App.removeParetoRow(${idx})">×</button></td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>
      ${items.length>0 ? `
      <div class="chart-box mt-3">
        <div class="chart-box-title">Pareto chart — frequency & cumulative %</div>
        <div class="chart-wrap" style="height:300px"><canvas id="paretoChart"></canvas></div>
      </div>` : `<div class="empty"><div class="empty-body">No categories yet.</div></div>`}
    </div>
  `;
};
App.addParetoRow = function(){
  this.current().analyze.pareto.push({ category:'New category', count:0 });
  this.saveAll();
  this.renderAnalyzeTab();
};
App.removeParetoRow = function(i){
  this.current().analyze.pareto.splice(i,1);
  this.saveAll();
  this.renderAnalyzeTab();
};
App.drawPareto = function(){
  if(!window.Chart) return;
  const p = this.current();
  const items = [...p.analyze.pareto].sort((a,b) => b.count - a.count);
  if(items.length === 0) return;
  const total = items.reduce((a,x) => a + x.count, 0) || 1;
  let cum = 0;
  const cumulative = items.map(it => { cum += it.count/total*100; return cum; });
  const canvas = document.getElementById('paretoChart');
  if(!canvas) return;
  new Chart(canvas, {
    data:{
      labels: items.map(i => i.category),
      datasets:[
        { type:'bar', label:'Count', data:items.map(i=>i.count), backgroundColor:'#7c2d12', yAxisID:'y' },
        { type:'line', label:'Cumulative %', data:cumulative, borderColor:'#b45309', borderWidth:2, pointRadius:4, pointBackgroundColor:'#b45309', fill:false, yAxisID:'y2', tension:.2 }
      ]
    },
    options:{ responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}}},
      scales:{
        x:{ticks:{font:{size:10}, maxRotation:30, minRotation:0}},
        y:{position:'left', ticks:{font:{size:10}}, title:{display:true, text:'Count', font:{size:10}}},
        y2:{position:'right', min:0, max:110, ticks:{font:{size:10}, callback:v=>v+'%'}, grid:{display:false}, title:{display:true, text:'Cumulative %', font:{size:10}}}
      }
    }
  });
};

App.getHypoGroup = function(letter){
  const sel = document.getElementById(`g${letter}-source`);
  if(!sel || !sel.value) return null;
  if(sel.value.startsWith('phase:')){
    const ph = sel.value.split(':')[1];
    return this.currentData(ph);
  }
  if(sel.value === 'paste'){
    return this.parseInputData(document.getElementById(`g${letter}-data`).value);
  }
  return null;
};
App.runHypoTest = function(){
  const type = document.getElementById('hypo-type').value;
  const result = document.getElementById('hypo-result');
  let resultObj, summary, label, htest;

  if(type === 'anova'){
    const groups = [], labels = [];
    [1,2,3,4].forEach(g => {
      const data = this.getHypoGroup(g);
      if(data && data.length >= 2){
        groups.push(data);
        labels.push(document.getElementById(`g${g}-label`).value || `Group ${g}`);
      }
    });
    if(groups.length < 2){ result.innerHTML = '<div class="callout callout-bad"><div class="callout-body">Need at least 2 groups with ≥ 2 values each.</div></div>'; return; }
    resultObj = SS.anova(groups);
    htest = resultObj.test;
    label = labels.join(' vs ');
    summary = `F(${resultObj.dfB}, ${resultObj.dfW}) = ${this.fmt(resultObj.F,3)}, p = ${this.fmt(resultObj.pValue,4)}. ${resultObj.verdict}. Group means: ${labels.map((l,i)=>`${l} = ${this.fmt(resultObj.groupMeans[i],2)}`).join(', ')}.`;
  } else {
    const a = this.getHypoGroup('A');
    const b = this.getHypoGroup('B');
    if(!a || !b || a.length < 2 || b.length < 2){ result.innerHTML = '<div class="callout callout-bad"><div class="callout-body">Both groups need ≥ 2 values.</div></div>'; return; }
    const labelA = document.getElementById('gA-label').value || 'Group A';
    const labelB = document.getElementById('gB-label').value || 'Group B';
    if(type === 'ttest'){
      resultObj = SS.twoSampleT(a, b);
      htest = resultObj.test;
      label = `${labelA} vs ${labelB}`;
      summary = `t(${this.fmt(resultObj.df,1)}) = ${this.fmt(resultObj.t,3)}, p = ${this.fmt(resultObj.pValue,4)}. Mean difference = ${this.fmt(resultObj.meanDiff,3)} (95% CI: ${this.fmt(resultObj.ci95Lower,3)} to ${this.fmt(resultObj.ci95Upper,3)}). ${resultObj.verdict}.`;
    } else {
      resultObj = SS.fTest(a, b);
      htest = resultObj.test;
      label = `${labelA} vs ${labelB}`;
      summary = `F(${resultObj.df1}, ${resultObj.df2}) = ${this.fmt(resultObj.F,3)}, p = ${this.fmt(resultObj.pValue,4)}. σ(A) = ${this.fmt(resultObj.stdA,3)}, σ(B) = ${this.fmt(resultObj.stdB,3)}. ${resultObj.verdict}.`;
    }
  }

  const significant = resultObj.significant;
  const decisionText = significant
    ? `The observed difference is unlikely to be due to random sampling (p &lt; 0.05). <strong>Treat the difference as real.</strong> If you're comparing baseline vs improved, this confirms the improvement is statistically credible \u2014 lock it in via the Control Plan. If you're comparing shifts / operators / batches, the gap is worth investigating in the Fishbone.`
    : `The observed difference could plausibly be due to random sampling (p \u2265 0.05). <strong>Do not claim an effect yet.</strong> Either collect more data (statistical power increases with n), or accept that the groups appear to behave similarly. Be especially cautious about claiming an improvement based on a non-significant test \u2014 it's the easiest way to deploy a change that doesn't actually work.`;

  result.innerHTML = `
    <div class="callout ${significant?'callout-good':'callout-info'}">
      <div class="callout-title">${significant ? '✓ Statistically significant' : '○ Not statistically significant'}</div>
      <div class="callout-body">${summary}</div>
    </div>
    <div class="callout callout-${significant?'good':'warn'}">
      <div class="callout-title">What to do with this result</div>
      <div class="callout-body">${decisionText}</div>
    </div>
    <button class="btn btn-sm" onclick="App.saveHypo('${this.esc(label)}','${this.esc(htest)}','${this.esc(summary)}',${significant})">💾 Save this test</button>
  `;
};
App.saveHypo = function(label, test, summary, significant){

App.renderBeforeAfter = function(){
  const p = this.current();
  const baseline = this.currentData('baseline');
  const implemented = this.currentData('implemented');
  const ctq = p.define.ctq;
  if(baseline.length<8 || implemented.length<8){
    return `<div class="callout callout-info"><div class="callout-title">Need data in both Baseline and Implemented phases</div><div class="callout-body">Add ≥ 8 points in each phase on the Measure module. Currently: Baseline ${baseline.length}, Implemented ${implemented.length}.</div></div>`;
  }
  const baseCap = SS.capability(baseline, ctq.lsl, ctq.usl);
  const impCap = SS.capability(implemented, ctq.lsl, ctq.usl);
  const tTest = SS.twoSampleT(baseline, implemented);
  const fTest = SS.fTest(baseline, implemented);

  return `
    <div class="card">
      <div class="card-title">Statistical proof of improvement</div>
      <div class="grid-4 mb-4">
        <div class="metric"><div class="metric-name">Cpk</div><div class="metric-val c-accent">${this.fmt(baseCap.cpk,2)} → ${this.fmt(impCap.cpk,2)}</div><div class="metric-sub">${(impCap.cpk-baseCap.cpk>=0?'+':'')+this.fmt(impCap.cpk-baseCap.cpk,2)}</div></div>
        <div class="metric"><div class="metric-name">Mean</div><div class="metric-val">${this.fmt(baseCap.mean,2)} → ${this.fmt(impCap.mean,2)}</div><div class="metric-sub">${(impCap.mean-baseCap.mean>=0?'+':'')+this.fmt(impCap.mean-baseCap.mean,2)}</div></div>
        <div class="metric"><div class="metric-name">σ (variation)</div><div class="metric-val ${impCap.stdev<baseCap.stdev?'c-green':'c-red'}">${this.fmt(baseCap.stdev,2)} → ${this.fmt(impCap.stdev,2)}</div><div class="metric-sub">${this.fmt(100*(1-impCap.stdev/baseCap.stdev),0)}% σ reduction</div></div>
        <div class="metric"><div class="metric-name">DPMO</div><div class="metric-val">${Math.round(baseCap.dpmo).toLocaleString()} → ${Math.round(impCap.dpmo).toLocaleString()}</div></div>
      </div>
      <div class="grid-2 mb-4">
        <div class="callout ${tTest.significant?'callout-good':'callout-warn'}">
          <div class="callout-title">${tTest.significant?'✓':'○'} Mean comparison (t-test)</div>
          <div class="callout-body">t = ${this.fmt(tTest.t,3)}, p = ${this.fmt(tTest.pValue,4)}. ${tTest.verdict}.</div>
        </div>
        <div class="callout ${fTest.significant?'callout-good':'callout-warn'}">
          <div class="callout-title">${fTest.significant?'✓':'○'} Variance comparison (F-test)</div>
          <div class="callout-body">F = ${this.fmt(fTest.F,3)}, p = ${this.fmt(fTest.pValue,4)}. ${fTest.verdict}.</div>
        </div>
      </div>
      <div class="grid-2">
        <div class="chart-box">
          <div class="chart-box-title">Baseline distribution (n=${baseline.length})</div>
          <div class="chart-wrap" style="height:200px"><canvas id="histBefore"></canvas></div>
        </div>
        <div class="chart-box">
          <div class="chart-box-title">Implemented distribution (n=${implemented.length})</div>
          <div class="chart-wrap" style="height:200px"><canvas id="histAfter"></canvas></div>
        </div>
      </div>
      <div class="chart-box">
        <div class="chart-box-title">Time series — Baseline → Implemented</div>
        <div class="chart-wrap" style="height:240px"><canvas id="timeSeries"></canvas></div>
      </div>
      <div class="callout">
        <div class="callout-title">Bottom line</div>
        <div class="callout-body">${
          tTest.significant && fTest.significant && impCap.cpk > baseCap.cpk ?
          `Both mean shift and variance reduction are statistically significant. Cpk improved from <strong>${this.fmt(baseCap.cpk,2)}</strong> to <strong>${this.fmt(impCap.cpk,2)}</strong>. The improvement is real, not random.` :
          tTest.significant && impCap.cpk > baseCap.cpk ?
          `Mean shifted significantly (p=${this.fmt(tTest.pValue,3)}), Cpk improved from ${this.fmt(baseCap.cpk,2)} to ${this.fmt(impCap.cpk,2)}. Variance reduction not yet statistically proven — continue collecting data.` :
          `Improvement not yet statistically conclusive. Either continue the pilot longer (more data) or revisit improvement levers.`
        }</div>
      </div>
    </div>
  `;
};
App.drawBeforeAfter = function(){
  if(!window.Chart) return;
  const p = this.current();
  const before = this.currentData('baseline'), after = this.currentData('implemented');
  if(before.length<8 || after.length<8) return;
  const drawHist = (id, data) => {
    const h = SS.histogram(data, Math.max(6, Math.min(12, Math.ceil(Math.sqrt(data.length)))));
    const centers = h.edges.slice(0,-1).map((e,i) => ((e+h.edges[i+1])/2).toFixed(1));
    const canvas = document.getElementById(id);
    if(canvas) new Chart(canvas, {
      type:'bar', data:{ labels:centers,
        datasets:[{ data:h.counts, backgroundColor:id==='histBefore'?'rgba(220,38,38,.4)':'rgba(21,128,61,.4)', borderColor:id==='histBefore'?'#dc2626':'#15803d', borderWidth:1 }]
      },
      options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9}}},y:{ticks:{font:{size:9}}}}}
    });
  };
  drawHist('histBefore', before);
  drawHist('histAfter', after);

  const ts = document.getElementById('timeSeries');
  if(ts){
    const allPoints = [
      ...before.map((v,i)=>({x:i+1, y:v, phase:'before'})),
      ...after.map((v,i)=>({x:before.length+i+1, y:v, phase:'after'}))
    ];
    new Chart(ts, {
      data:{ datasets:[
        { type:'scatter', label:'Baseline', data:before.map((v,i)=>({x:i+1,y:v})), backgroundColor:'#dc2626', pointRadius:3 },
        { type:'scatter', label:'Implemented', data:after.map((v,i)=>({x:before.length+i+1,y:v})), backgroundColor:'#15803d', pointRadius:3 }
      ]},
      options:{responsive:true,maintainAspectRatio:false,animation:false,
        plugins:{legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}},
          annotation:{}},
        scales:{x:{type:'linear',ticks:{font:{size:10}},title:{display:true,text:'Observation #',font:{size:10}}},y:{ticks:{font:{size:10}},title:{display:true,text:p.define.ctq.name,font:{size:10}}}}
      }
    });
  }
};

App.renderDOE = function(){
  const p = this.current();
  const doe = p.improve.doe || { factors:['Factor 1','Factor 2'], levels:[['Low','High'],['Low','High']], responses:[0,0,0,0] };
  const k = doe.factors.length;
  const n = Math.pow(2, k);
  const designRows = [];
  for(let i=0; i<n; i++){
    const row = [];
    for(let j=0; j<k; j++){
      row.push((Math.floor(i/Math.pow(2,j))%2===0) ? doe.levels[j][0] : doe.levels[j][1]);
    }
    designRows.push(row);
  }
  let analysis = null;
  if(doe.responses.length === n && doe.responses.every(r => !isNaN(r))){
    analysis = SS.doe2k(doe.factors, doe.responses);
  }
  return `
    <div class="card">
      <div class="card-title">2-level factorial DOE
        <div class="flex gap-2">
          <button class="btn btn-sm ${k===2 ? 'btn-primary':''}" onclick="App.setDOEFactors(2)">2² (4 runs)</button>
          <button class="btn btn-sm ${k===3 ? 'btn-primary':''}" onclick="App.setDOEFactors(3)">2³ (8 runs)</button>
        </div>
      </div>
      <div class="text-sm tx-3 mb-3">Configure factors and high/low levels, then enter the response (CTQ value) for each run.</div>
      <div class="grid-${k} mb-3" style="grid-template-columns:repeat(${k},1fr);gap:12px">
        ${doe.factors.map((f,j) => `
          <div>
            <label class="label">Factor ${j+1}</label>
            <input class="input mb-2" value="${this.esc(f)}" oninput="App.current().improve.doe.factors[${j}]=this.value;App.saveAll();App.renderImpTab()">
            <div class="field-row">
              <input class="input" value="${this.esc(doe.levels[j][0])}" oninput="App.current().improve.doe.levels[${j}][0]=this.value;App.saveAll();App.renderImpTab()" placeholder="Low (−)">
              <input class="input" value="${this.esc(doe.levels[j][1])}" oninput="App.current().improve.doe.levels[${j}][1]=this.value;App.saveAll();App.renderImpTab()" placeholder="High (+)">
            </div>
          </div>`).join('')}
      </div>

      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>Run</th>${doe.factors.map(f=>`<th>${this.esc(f)}</th>`).join('')}<th>Response</th></tr></thead>
          <tbody>
          ${designRows.map((r,i)=>`
            <tr>
              <td class="text-mono">${i+1}</td>
              ${r.map(x=>`<td>${this.esc(x)}</td>`).join('')}
              <td><input type="number" step="any" value="${doe.responses[i] ?? ''}" oninput="App.updateDOEResponse(${i},this.value)" class="tbl-fit"></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>

      ${analysis ? `
        <div class="h3 mt-4">Effect Analysis</div>
        <div class="grid-4 mb-3">
          <div class="metric"><div class="metric-name">Grand mean</div><div class="metric-val">${this.fmt(analysis.grandMean,2)}</div></div>
          <div class="metric"><div class="metric-name">Largest effect</div><div class="metric-val c-accent">${this.esc(analysis.sortedEffects[0][0])}</div><div class="metric-sub">${this.fmt(analysis.sortedEffects[0][1],3)}</div></div>
          <div class="metric"><div class="metric-name">Smallest effect</div><div class="metric-val">${this.esc(analysis.sortedEffects[analysis.sortedEffects.length-1][0])}</div><div class="metric-sub">${this.fmt(analysis.sortedEffects[analysis.sortedEffects.length-1][1],3)}</div></div>
          <div class="metric"><div class="metric-name">Significant terms</div><div class="metric-val c-accent">${(SS.doeSignificance(analysis)||[]).filter(s=>s.significant).length}</div><div class="metric-sub">via Lenth's method</div></div>
        </div>

        <div class="h3 mt-3">Significance test (Lenth's method, no replication needed)</div>
        <div class="text-sm tx-3 mb-2">Lenth's pseudo standard error (PSE) lets you test effect significance without replicated runs. Margin of error ≈ 2.57 × PSE at ~95% confidence (Lenth, 1989).</div>
        <div class="tbl-wrap mb-3">
          <table class="tbl">
            <thead><tr><th>Effect</th><th class="text-right">Value</th><th class="text-right">|Effect|</th><th class="text-right">t (Lenth)</th><th>Significant?</th></tr></thead>
            <tbody>
              ${(SS.doeSignificance(analysis)||[]).map(s => `
                <tr ${s.significant?'class="row-good"':''}>
                  <td><strong>${this.esc(s.name)}</strong></td>
                  <td class="text-right text-mono">${s.effect>=0?'+':''}${s.effect.toFixed(3)}</td>
                  <td class="text-right text-mono">${s.absEffect.toFixed(3)}</td>
                  <td class="text-right text-mono">${s.tLenth.toFixed(2)}</td>
                  <td>${s.significant?'<span class="badge badge-good">yes</span>':'<span class="badge badge-warn">no</span>'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>

        <div class="chart-box">
          <div class="chart-box-title">Pareto of effects (red dashed line = Lenth's ME)</div>
          <div class="chart-wrap" style="height:260px"><canvas id="doeChart"></canvas></div>
        </div>

        <div class="h3 mt-3">Regression model (effects as coefficients)</div>
        <div class="text-sm tx-3 mb-2">In a 2-level factorial, each effect = 2 × regression coefficient on the coded (\u00b11) factor. Use this equation to predict response at any factor setting.</div>
        <div class="callout callout-info">
          <div class="callout-body text-mono" style="font-size:14px;color:var(--accent);font-weight:600">
            y = ${analysis.grandMean.toFixed(3)}${analysis.sortedEffects.map(eff => (eff[1]>=0?' + ':' \u2212 ') + (Math.abs(eff[1])/2).toFixed(3) + '\u00b7' + this.esc(eff[0])).join('')}
          </div>
          <div class="text-xs tx-3 mt-2">Where each factor takes value \u22121 (low) or +1 (high). Interaction terms are products of factor codes.</div>
        </div>

        <div class="h3 mt-3">Response Optimizer</div>
        <div class="text-sm tx-3 mb-2">Find the factor settings that maximize or minimize the response. The optimizer evaluates all 2^k corners.</div>
        <div class="flex gap-2 mb-2">
          <label class="text-sm flex items-center gap-2"><input type="radio" name="doe-goal" value="max" checked onchange="App.renderImpTab()"> Maximize</label>
          <label class="text-sm flex items-center gap-2"><input type="radio" name="doe-goal" value="min" onchange="App.renderImpTab()"> Minimize</label>
        </div>
        <div class="callout callout-good">
          <div class="callout-title">Optimal settings (max response)</div>
          <div class="callout-body">${this.doeOptimal(analysis, doe, 'max')}</div>
        </div>
        <div class="callout">
          <div class="callout-title">Settings for minimum response</div>
          <div class="callout-body">${this.doeOptimal(analysis, doe, 'min')}</div>
        </div>

        <div class="chart-box mt-3">
          <div class="chart-box-title">Residuals vs Fitted (model adequacy check)</div>
          <div class="chart-wrap" style="height:240px"><canvas id="doeResid"></canvas></div>
        </div>

        ${doe.factors.length === 2 ? `
          <div class="chart-box mt-3">
            <div class="chart-box-title">Response Surface (contour plot) \u2014 predicted response across factor space</div>
            <div class="text-sm tx-3 mb-2">Color encodes predicted response. The optimum corner is the brightest cell. Black diamonds mark the 4 actual experimental runs.</div>
            <div class="chart-wrap" style="height:340px"><canvas id="doeContour"></canvas></div>
            <div class="text-xs tx-3 mt-2 text-mono">X-axis: ${this.esc(doe.factors[0])} (\u22121 = ${this.esc(doe.levels[0][0])}, +1 = ${this.esc(doe.levels[0][1])}) \u00B7 Y-axis: ${this.esc(doe.factors[1])} (\u22121 = ${this.esc(doe.levels[1][0])}, +1 = ${this.esc(doe.levels[1][1])})</div>
          </div>
        ` : ''}
      ` : ''}
    </div>
  `;
};
App.setDOEFactors = function(k){
  const cur = this.current().improve.doe || { factors:[], levels:[], responses:[] };
  const newFactors = [];
  const newLevels = [];
  for(let i=0; i<k; i++){
    newFactors.push(cur.factors[i] || `Factor ${i+1}`);
    newLevels.push(cur.levels[i] || ['Low','High']);
  }
  this.current().improve.doe = {
    factors: newFactors, levels: newLevels,
    responses: new Array(Math.pow(2,k)).fill(0).map((_,i) => cur.responses[i] ?? 0)
  };
  this.saveAll();
  this.renderImpTab();
};
App.updateDOEResponse = function(i, val){
  const r = parseFloat(val); if(isNaN(r)) return;
  this.current().improve.doe.responses[i] = r;
  this.saveAll();
  this.renderImpTab();
};
App.drawDOE = function(){
  if(!window.Chart) return;
  const p = this.current();
  if(!p.improve.doe) return;
  const analysis = SS.doe2k(p.improve.doe.factors, p.improve.doe.responses);
  if(!analysis || analysis.error) return;
  const sig = SS.doeSignificance(analysis);
  const me = sig?.[0]?.marginOfError || 0;
  const canvas = document.getElementById('doeChart');
  if(canvas){
    const sorted = analysis.sortedEffects;
    new Chart(canvas, {
      data: { labels: sorted.map(s=>s[0]),
        datasets:[
          { type:'bar', data: sorted.map(s=>Math.abs(s[1])),
            backgroundColor: sorted.map((s,i)=> (sig && sig[i] && sig[i].significant) ? (s[1]>0?'#15803d':'#dc2626') : '#d1d5db'),
            borderWidth:0 },
          { type:'line', label:`Lenth ME = ${me.toFixed(3)}`, data:Array(sorted.length).fill(me),
            borderColor:'#dc2626', borderWidth:1.5, borderDash:[6,3], pointRadius:0 }
        ]
      },
      options:{ responsive:true, maintainAspectRatio:false, animation:false, indexAxis:'y',
        plugins:{
          legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}},
          tooltip:{callbacks:{label:ctx=>{
            if(ctx.datasetIndex===1) return 'ME = '+ctx.parsed.x.toFixed(3);
            const e = analysis.sortedEffects[ctx.dataIndex];
            return '|effect| = '+ctx.parsed.x.toFixed(3)+' ('+(e[1]>0?'+':'')+e[1].toFixed(3)+')';
          }}}
        },
        scales:{x:{ticks:{font:{size:10}}, title:{display:true, text:'|Effect|', font:{size:10}}}, y:{ticks:{font:{size:10}}}}
      }
    });
  }
  // Residuals: for a 2^k full factorial, fitted at each corner = sum of half-effects with correct sign
  const doe = p.improve.doe;
  const k = doe.factors.length;
  const n = Math.pow(2,k);
  // Reconstruct design matrix
  const design = [];
  for(let i=0;i<n;i++){
    const row = [];
    for(let j=0;j<k;j++) row.push((Math.floor(i/Math.pow(2,j))%2===0)?-1:1);
    design.push(row);
  }
  // Fitted = grand mean + sum over effects of (effect/2) * sign(effect in this run)
  const fitted = design.map((row,i) => {
    let pred = analysis.grandMean;
    Object.entries(analysis.effects).forEach(([name, val]) => {
      // Determine sign of this effect at run i
      let sign = 1;
      const parts = name.split('\u00d7');
      parts.forEach(part => {
        const fi = doe.factors.indexOf(part);
        if(fi >= 0) sign *= row[fi];
      });
      pred += (val/2) * sign;
    });
    return pred;
  });
  // In a saturated full factorial all variation goes into effects → residuals ≈ 0
  // We still plot fitted vs observed to verify model arithmetic
  const residuals = doe.responses.map((y,i) => y - fitted[i]);
  const residCanvas = document.getElementById('doeResid');
  if(residCanvas){
    const pts = fitted.map((f,i) => ({x:f, y:residuals[i]}));
    new Chart(residCanvas, {
      data:{ datasets:[
        { type:'scatter', label:'Residual', data:pts, backgroundColor:'#1d4ed8', pointRadius:5 },
        { type:'line', label:'Zero', data:[{x:Math.min(...fitted),y:0},{x:Math.max(...fitted),y:0}], borderColor:'#dc2626', borderWidth:1, borderDash:[4,4], pointRadius:0 }
      ]},
      options:{ responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{display:true,position:'bottom',labels:{font:{size:10},boxWidth:8}} },
        scales:{ x:{type:'linear',title:{display:true,text:'Fitted',font:{size:10}},ticks:{font:{size:10}}},
                 y:{title:{display:true,text:'Residual',font:{size:10}},ticks:{font:{size:10}}} }
      }
    });
  }

  // Response Surface (Contour) — for 2-factor DOE only
  const contourCanvas = document.getElementById('doeContour');
  if(contourCanvas && doe.factors.length === 2){
    const surface = SS.doeSurface(analysis, doe, 21);
    if(surface){
      // Flatten surface to points; encode predicted response in point color
      const flat = [];
      surface.forEach(row => row.forEach(cell => flat.push(cell)));
      const yMin = Math.min(...flat.map(c => c.y));
      const yMax = Math.max(...flat.map(c => c.y));
      const yRange = yMax - yMin || 1;
      // Color: use HSL gradient from red (low) -> amber -> green (high)
      const colorFor = y => {
        const t = (y - yMin) / yRange;  // 0..1
        const hue = Math.round(t * 130);  // 0 (red) to 130 (green)
        return `hsl(${hue}, 70%, 55%)`;
      };
      // Build scatter dataset with one square per grid cell
      const cells = flat.map(c => ({ x: c.xA, y: c.xB, response: c.y }));
      // Mark the 4 experimental runs distinctly
      const runPoints = [
        { x: -1, y: -1, response: doe.responses[0] },
        { x:  1, y: -1, response: doe.responses[1] },
        { x: -1, y:  1, response: doe.responses[2] },
        { x:  1, y:  1, response: doe.responses[3] }
      ];

      new Chart(contourCanvas, {
        type: 'scatter',
        data: {
          datasets: [
            {
              label: 'Predicted response (surface)',
              data: cells,
              pointBackgroundColor: cells.map(c => colorFor(c.response)),
              pointBorderColor: cells.map(c => colorFor(c.response)),
              pointRadius: 11,
              pointStyle: 'rect'
            },
            {
              label: 'Actual experimental runs',
              data: runPoints,
              pointBackgroundColor: '#000',
              pointBorderColor: '#fff',
              pointBorderWidth: 2,
              pointRadius: 8,
              pointStyle: 'rectRot'
            }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: {
            legend: { display: true, position: 'bottom', labels: { font: { size: 10 }, boxWidth: 10 } },
            tooltip: {
              callbacks: {
                label: ctx => {
                  const d = ctx.raw;
                  if(ctx.datasetIndex === 1){
                    return `Run: ${doe.factors[0]}=${d.x>0?'+':''}${d.x}, ${doe.factors[1]}=${d.y>0?'+':''}${d.y} \u2192 actual ${d.response.toFixed(2)}`;
                  }
                  return `${doe.factors[0]}=${d.x.toFixed(2)}, ${doe.factors[1]}=${d.y.toFixed(2)} \u2192 predicted ${d.response.toFixed(2)}`;
                }
              }
            }
          },
          scales: {
            x: { type: 'linear', min: -1.1, max: 1.1,
                 title: { display: true, text: doe.factors[0]+' (coded)', font: { size: 10 } },
                 ticks: { font: { size: 10 }, stepSize: 0.5 } },
            y: { type: 'linear', min: -1.1, max: 1.1,
                 title: { display: true, text: doe.factors[1]+' (coded)', font: { size: 10 } },
                 ticks: { font: { size: 10 }, stepSize: 0.5 } }
          }
        }
      });
    }
  }
};
App.doeOptimal = function(analysis, doe, goal){
  goal = goal || 'max';
  const k = doe.factors.length, n = Math.pow(2,k);
  let bestIdx = 0, bestVal = doe.responses[0];
  for(let i=1; i<n; i++){
    if(goal==='max' ? doe.responses[i] > bestVal : doe.responses[i] < bestVal){
      bestVal = doe.responses[i]; bestIdx = i;
    }
  }
  const settings = [];
  for(let j=0; j<k; j++){
    const lvl = (Math.floor(bestIdx/Math.pow(2,j))%2===0) ? 0 : 1;
    settings.push(`<strong>${doe.factors[j]}</strong> = ${doe.levels[j][lvl]}`);
  }
  return `${goal==='max'?'Best':'Lowest'} response = <strong>${App.fmt(bestVal,2)}</strong> at: ${settings.join(' \u00b7 ')}. (Run #${bestIdx+1})`;
};

App.setMSADims = function(field, val){
  const v = parseInt(val); if(isNaN(v)||v<2) return;
  const msa = this.current().msa;
  msa[field] = v;
  this.regenMSAData();
  this.saveAll();
  this.render_msa();
};
App.regenMSAData = function(){
  const msa = this.current().msa;
  const ops = []; for(let i=0; i<msa.operators; i++) ops.push(String.fromCharCode(65+i));
  const parts = []; for(let i=0; i<msa.parts; i++) parts.push('P'+(i+1));
  const oldData = {};
  msa.data.forEach(d => { oldData[`${d.operator}|${d.part}|${d.trial}`] = d.value; });
  const newData = [];
  ops.forEach(op => {
    parts.forEach(pt => {
      for(let t=0; t<msa.trials; t++){
        const key = `${op}|${pt}|${t+1}`;
        newData.push({ operator:op, part:pt, trial:t+1, value: oldData[key] ?? 0 });
      }
    });
  });
  msa.data = newData;
};
App.renderMSAGrid = function(){
  const msa = this.current().msa;
  const ops = [...new Set(msa.data.map(d=>d.operator))];
  const parts = [...new Set(msa.data.map(d=>d.part))];
  const target = document.getElementById('msa-grid'); if(!target) return;
  let html = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Operator</th><th>Part</th>';
  for(let t=1; t<=msa.trials; t++) html += `<th>T${t}</th>`;
  html += '</tr></thead><tbody>';
  ops.forEach(op => {
    parts.forEach((pt,pi) => {
      html += `<tr>${pi===0?`<td rowspan="${parts.length}" class="text-mono" style="font-weight:600">${op}</td>`:''}<td class="text-mono">${pt}</td>`;
      for(let t=1; t<=msa.trials; t++){
        const idx = msa.data.findIndex(d => d.operator===op && d.part===pt && d.trial===t);
        const v = idx >= 0 ? msa.data[idx].value : 0;
        html += `<td><input type="number" step="any" class="tbl-fit" value="${v}" oninput="App.updateMSACell('${op}','${pt}',${t},this.value)"></td>`;
      }
      html += '</tr>';
    });
  });
  html += '</tbody></table></div>';
  target.innerHTML = html;
};
App.updateMSACell = function(op, pt, trial, val){
  const msa = this.current().msa;
  const idx = msa.data.findIndex(d => d.operator===op && d.part===pt && d.trial===trial);
  if(idx>=0) msa.data[idx].value = parseFloat(val) || 0;
  this.saveAll();
  this.renderMSAResults();
};
App.renderMSAResults = function(){

App.loadAIAGBenchmark = function(){

App.conceptCoqHint = function(cat, p){
  const text = JSON.stringify(p).toLowerCase();
  const checks = {
    'Prevention': /standard|training|sop|kanban|poka|prevent|calibration/.test(text),
    'Appraisal': /inspect|audit|check|gauge|msa|control chart|spc|appraisal/.test(text),
    'Internal failure': /off-grade|rework|scrap|internal|re-handling|downtime/.test(text),
    'External failure': /complaint|return|warranty|external|customer/.test(text)
  };
  return checks[cat] ? 'Evidence present in project record' : 'Add evidence or impact estimate';
};

    <div class="lead">From descriptive quality analysis to predictive process intelligence. Quantify how much each process variable drives the CTQ — exact slope, p-value, R². Rank predictors by influence.</div>

    <div class="tabs">
      <div class="tab ${this.state.regressionTab==='data'?'active':''}" onclick="App.switchRegTab('data')">Data</div>
      <div class="tab ${this.state.regressionTab==='corr'?'active':''}" onclick="App.switchRegTab('corr')">Correlation Matrix</div>
      <div class="tab ${this.state.regressionTab==='simple'?'active':''}" onclick="App.switchRegTab('simple')">Simple Regression</div>
      <div class="tab ${this.state.regressionTab==='multi'?'active':''}" onclick="App.switchRegTab('multi')">Multiple Regression</div>
    </div>
    <div id="reg-content"></div>
  `;
  this.renderRegTab();
};
App.switchRegTab = function(t){
  this.state.regressionTab = t;
  document.querySelectorAll('#content .tabs .tab').forEach((el,i) => {
    const tabs = ['data','corr','simple','multi'];
    el.classList.toggle('active', tabs[i] === t);
  });
  this.renderRegTab();
};
App.renderRegTab = function(){
  const target = document.getElementById('reg-content'); if(!target) return;
  switch(this.state.regressionTab){
    case 'data':   target.innerHTML = this.renderRegData(); break;
    case 'corr':   target.innerHTML = this.renderCorrMatrix(); setTimeout(()=>this.drawCorrMatrix(),50); break;
    case 'simple': target.innerHTML = this.renderSimpleReg(); setTimeout(()=>this.drawSimpleReg(),50); break;
    case 'multi':  target.innerHTML = this.renderMultiReg(); setTimeout(()=>this.drawMultiReg(),50); break;
  }
};

/* ----- REG: DATA ENTRY ----- */

  return `

        <div>
          <label class="label">Paste Excel/CSV table (with headers in row 1)</label>

          <div class="flex gap-2 mt-2">
            <button class="btn btn-primary btn-sm" onclick="App.regPasteTable()">Replace data with paste</button>

          <div class="text-xs tx-3 mb-2">Click a column header to rename. The Y column is the one you want to predict / explain.</div>
          ${r.columns.map((c,i)=>`
            <div class="flex gap-2 items-center mb-2">
              <input type="radio" name="reg-y" ${i===r.responseIndex?'checked':''} onchange="App.setRegResponse(${i})" title="Set as response (Y)">
              <input class="input" value="${this.esc(c.name)}" oninput="App.current().regression.columns[${i}].name=this.value;App.saveAll()" style="flex:1">
              <button class="btn-ghost btn-danger btn-sm" onclick="App.removeRegColumn(${i})" title="Remove column">\u00d7</button>

          `).join('')}

      </div>

      <div class="tbl-wrap" style="max-height:380px;overflow-y:auto">
        <table class="tbl">
          <thead><tr>
            <th style="width:50px">#</th>
            ${r.columns.map((c,i)=>`<th>${this.esc(c.name)} ${i===r.responseIndex?'<span class="badge badge-accent" style="margin-left:4px">Y</span>':''}</th>`).join('')}
          </tr></thead>
          <tbody>
          ${Array.from({length:rows},(_,row)=>`
            <tr>
              <td class="text-mono tx-3">${row+1}</td>
              ${r.columns.map((c,i)=>`
                <td><input type="number" step="any" class="tbl-fit"
                  value="${c.values[row]??''}"
                  oninput="App.updateRegCell(${i},${row},this.value)"></td>
